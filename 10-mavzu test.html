<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6-Sinf Tarix | 10-Mavzu: Interaktiv Test</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 25px 20px;
        }

        .header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 12px;
        }

        .topic-title {
            font-size: 1.2rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .slide-counter {
            font-size: 1.2rem;
            font-weight: 700;
            background: #1e293b;
            padding: 5px 16px;
            border-radius: 20px;
            color: #38bdf8;
            border: 1px solid #334155;
        }

        .main-content {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: auto 0;
        }

        .question-box {
            font-size: 1.7rem;
            font-weight: 700;
            line-height: 1.35;
            color: #ffffff;
            text-align: center;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .option-card {
            background: #1e293b;
            border: 2px solid #334155;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #e2e8f0;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-card:hover:not(.disabled) {
            border-color: #38bdf8;
            background: #334155;
            transform: translateY(-2px);
        }

        .option-letter {
            background: #334155;
            color: #38bdf8;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        /* To'g'ri va xato ranglar */
        .option-card.correct {
            background: rgba(34, 197, 94, 0.2) !important;
            border-color: #22c55e !important;
            color: #4ade80 !important;
        }
        .option-card.correct .option-letter {
            background: #22c55e !important;
            color: #0f172a !important;
        }

        .option-card.wrong {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: #ef4444 !important;
            color: #f87171 !important;
        }
        .option-card.wrong .option-letter {
            background: #ef4444 !important;
            color: #ffffff !important;
        }

        .option-card.disabled {
            cursor: default;
        }

        .explanation-box {
            font-size: 1.1rem;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 12px 20px;
            border-radius: 10px;
            width: 100%;
            text-align: center;
            display: none;
        }

        .next-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            display: none;
            transition: all 0.2s ease;
        }

        .next-btn:hover {
            background: #0284c7;
            color: #ffffff;
            transform: scale(1.05);
        }

        /* Natija oynasi */
        .result-box {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
            background: #1e293b;
            border: 2px solid #334155;
            padding: 40px 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            margin: auto 0;
        }

        .result-title {
            font-size: 2rem;
            font-weight: 800;
            color: #38bdf8;
        }

        .result-score {
            font-size: 3.5rem;
            font-weight: 900;
            color: #4ade80;
        }

        .result-percent {
            font-size: 1.4rem;
            color: #94a3b8;
        }

        .restart-btn {
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 14px 35px;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }

        .restart-btn:hover {
            background: #16a34a;
            color: #ffffff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="header" id="quiz-header">
        <div class="topic-title">6-sinf Tarix | 10-Mavzu Testi</div>
        <div class="slide-counter" id="counter">1 / 25</div>
    </div>

    <!-- Test bloki -->
    <div class="main-content" id="quiz-box">
        <div class="question-box" id="question">Savol yuklanmoqda...</div>

        <div class="options-grid">
            <div class="option-card" onclick="selectOption(0)"><div class="option-letter">A</div><span id="opt-text-0"></span></div>
            <div class="option-card" onclick="selectOption(1)"><div class="option-letter">B</div><span id="opt-text-1"></span></div>
            <div class="option-card" onclick="selectOption(2)"><div class="option-letter">C</div><span id="opt-text-2"></span></div>
            <div class="option-card" onclick="selectOption(3)"><div class="option-letter">D</div><span id="opt-text-3"></span></div>
        </div>

        <div class="explanation-box" id="explanation"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Keyingi savol ➔</button>
    </div>

    <!-- Yakuniy natija bloki -->
    <div class="result-box" id="result-box">
        <div class="result-title">Sinov yakunlandi!</div>
        <div class="result-score" id="score-text">0 / 25</div>
        <div class="result-percent" id="percent-text">Ko‘rsatkich: 0%</div>
        <div id="feedback-text" style="font-size: 1.2rem; color: #f8fafc;"></div>
        <button class="restart-btn" onclick="restartQuiz()">Qaytadan ishlash 🔄</button>
    </div>

    <script>
        // Tovush generatori
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration, startTime = 0) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + startTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime + startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + startTime);
                osc.stop(audioCtx.currentTime + startTime + duration);
            } catch (e) {}
        }
        function playSuccess() { playTone(523.25, 'sine', 0.2, 0); playTone(659.25, 'sine', 0.3, 0.08); playTone(1046.50, 'sine', 0.5, 0.16); }
        function playFail() { playTone(300, 'sawtooth', 0.3); }

        const tests = [
            { q: "Qadimgi Misr alifbosidagi belgilar (iyerogliflar) soni nechta bo‘lgan?", opts: ["365 ta", "500 ta", "750 ta", "1000 ta"], ans: 2, exp: "Misrliklar alifbosi 750 iyeroglifdan iborat bo‘lgan." },
            { q: "Yunon tilidan tarjima qilinganda «iyeroglif» so‘zi qanday ma’noni bildiradi?", opts: ["«Suratli yozuv»", "«Muqaddas bitiklar»", "«Podsho yozuvi»", "«Qadimgi kalom»"], ans: 1, exp: "Yunonlar ularni «iyerogliflar» («muqaddas bitiklar») deyishgan." },
            { q: "Misr iyerogliflari sirini ochgan fransuz olimi kim?", opts: ["Gerodot", "Jak-Fransua Shampolyon", "Strabon", "Arrian"], ans: 1, exp: "1822-yilda fransuz olimi Jak-Fransua Shampolyon iyerogliflarni o‘qishga muvaffaq bo‘ldi." },
            { q: "Iyerogliflar yozilgan mashhur Rozett toshi qayerdagi muzeyda saqlanmoqda?", opts: ["Parijdagi Luvr muzeyida", "Qohira milliy muzeyida", "Londondagi Britaniya muzeyida", "Berlin muzeyida"], ans: 2, exp: "Rozett bitiktoshi bugungi kunda Londondagi Britaniya muzeyida saqlanmoqda." },
            { q: "Qadimgi Misrda asosiy uzunlik o‘lchov birligi nima deb nomlangan?", opts: ["Qadam", "Tirsak", "Gaz", "Farsax"], ans: 1, exp: "Misrda asosiy o‘lchov birligi «tirsak» bo‘lgan." },
            { q: "«Podsho tirsagi» standarti necha santimetrga teng bo‘lgan?", opts: ["30 sm", "45 sm", "52,5 sm", "100 sm"], ans: 2, exp: "Yagona o‘lchov sifatida «podsho tirsagi» 52,5 santimetrga teng deb belgilangan." },
            { q: "Misrliklar bir kunlik vaqtni o‘lchash uchun qanday soat turidan foydalanganlar?", opts: ["Qum soati", "Quyosh soati", "24 ta bo‘lmali suv soati", "Mexanik soat"], ans: 2, exp: "Misrda vaqt 24 ta bo‘lmaga ajratilgan maxsus suv soatlari yordamida o‘lchangan." },
            { q: "Misrda yulduzlar harakatini kuzatish natijasida qaysi fan dunyoga keldi?", opts: ["Geometriya", "Astronomiya", "Fizika", "Kimyo"], ans: 1, exp: "Yulduzlarga qarab muddatlarni aniqlash natijasida astronomiya fani dunyoga keldi." },
            { q: "Misrliklar o‘z yozuvlarini nima uchun «ma’budlar kalomi» deb ataganlar?", opts: ["U faqat oltin bilan yozilgani uchun", "Duolar va diniy marosimlarni yozib borishda foydalanilgani sababli", "Faqat xudolar tushunadi deb o‘ylashgani uchun", "U osmondan tushgan deb ishonishgani uchun"], ans: 1, exp: "Yozuvdan duolar va marosimlarni yozib borishda foydalanilgan, shuning uchun «ma’budlar kalomi» deyilgan." },
            { q: "Misrda ta’lim olayotgan o‘quvchilar qog‘ozni tejash uchun dastlab nimalarga yozishgan?", opts: ["Daraxt po‘stlog‘iga", "Sopol idishlar parchasiga yoki ohaktoshga", "Hayvon terisiga", "Qum ustiga"], ans: 1, exp: "Ta’lim olayotganda sopol idishlar parchasiga yoki ohaktoshga yozishgan." },
            { q: "Rozett toshida qaysi tillardagi bir xil mazmundagi matn bitilgan edi?", opts: ["Lotin va fors", "Qadimgi misr va qadimgi yunon", "Bobil va misr", "Arab va yunon"], ans: 1, exp: "Rozett toshida qadimgi misr va qadimgi yunon tillaridagi bir xil ma’nodagi bitik bor edi." },
            { q: "Shampolyon iyerogliflarni o‘qishda qaysi metoddan foydalandi?", opts: ["Sun’iy intellektdan", "Ma’lum bo‘lgan yunoncha matn bilan misr belgilarini taqqoslash usulidan", "Arab tiliga tarjima qilishdan", "Faqat rasmlarni tahlil qilishdan"], ans: 1, exp: "Yunon tilidagi matnni iyerogliflar bilan taqqoslab ko‘rib, ularning ma’nosini tushuntirib berdi." },
            { q: "Misrliklar yaratgan taqvimning yillik tuzilishi qanday bo‘lgan?", opts: ["360 kun (har oy 30 kundan)", "365 kun (30 kundan 12 oy va 5 kun bayram)", "354 kun (oy taqvimi)", "366 kun (har oy 31 kundan)"], ans: 1, exp: "365 kun bo‘lib, 30 kundan 12 oyga taqsimlangan, ortib qolgan 5 kun bayram hisoblangan." },
            { q: "Misrda geometriya fani qanday amaliy faoliyat asosida rivojlandi?", opts: ["Dengizda suzishda", "Anhorlar qazish va binolar maydonini o‘lchash jarayonida", "Yulduzlar masofasini o‘lchashda", "Faqat savdo-sotiqda"], ans: 1, exp: "Anhorlar qazish va inshootlar barpo etishda maydon hajmini o‘lchash tufayli geometriya dunyoga keldi." },
            { q: "Misr o‘lchov birliklari bo‘yicha «bir tirsak» necha kaftga teng bo‘lgan?", opts: ["4 ta kaft", "7 ta kaft", "10 ta kaft", "12 ta kaft"], ans: 1, exp: "Darslik jadvalida: Bir kaft = to‘rt barmoq; Bir tirsak = yettita kaft deb ko‘rsatilgan." },
            { q: "Misrlik tabiblarning inson anatomiyasini mukammal o‘rganishiga nima sabab bo‘ldi?", opts: ["Janglardagi jarohatlarni davolash", "Mayitlarni mumiyolash jarayonida ichki a’zolarni o‘rganish", "Hayvonlarni so‘yish", "Chet el tabobatini o‘rganish"], ans: 1, exp: "Mumiyolangan mayitlarni tayyorlash jarayonida odamning ichki tuzilishini yaxshi o‘rganganlar." },
            { q: "Qadimgi Misr tabobatida muolaja qilishda asosan nimalar qo‘llanilgan?", opts: ["Faqat kimyoviy dorilar", "Giyohlar damlamasi, ma’danli suvlar va tuz", "Faqat jarrohlik amaliyoti", "Faqat sehr-jodu"], ans: 1, exp: "Davolash muolajasida giyohlar damlamasi, ma’danli suvlar va tuzdan keng foydalanilgan." },
            { q: "Nima sababdan Misrda «podsho tirsagi» degan yagona standart qabul qilindi?", opts: ["Faqat fir’avn saroyini o‘lchash uchun", "Har bir odamning qo‘l uzunligi turlicha bo‘lib, chalkashlik yuzaga kelmasligi uchun", "Yangi podsholik sharafiga", "Yunonlar talabi bilan"], ans: 1, exp: "Qo‘llar uzunligi turlicha bo‘lgani sababli «podsho tirsagi» (52,5 sm) yagona o‘lchov qilib belgilangan." },
            { q: "Misr suv soatida «bir soat» vaqt birligi qanday aniqlangan?", opts: ["Suv to‘liq bug‘lanib ketishi bilan", "Maxsus idishning bir bo‘lmasidan ikkinchisiga oqib o‘tgan suv hajmi bilan", "Suvning muzlash vaqti bilan", "Quduqdan suv tortish muddati bilan"], ans: 1, exp: "Bir bo‘lmadan ikkinchisiga oqib o‘tadigan suvning hajmi bir soat deb hisoblangan." },
            { q: "Qadimgi Misr yozuvining asosiy xususiyatini aniqlang:", opts: ["Faqat 24 ta unli harfdan iborat edi", "Har bir so‘z o‘zida bir qancha ramzlar va timsollarni ifodalovchi rasmlardan iborat edi", "Faqat chapdan o‘ngga yozilgan", "Faqat metall plastinkalarga yozilgan"], ans: 1, exp: "Har bir so‘z o‘zida bir qancha ramzlar va timsollarni ifoda etgan." },
            { q: "Misrda husnixat egalari (xattotlar) qanday ijtimoiy mavqega ega edilar?", opts: ["Ular qullar qatoriga kiritilgan", "Yuksak savodxon hisoblanib, katta imtiyoz va izzat-hurmatga ega bo‘lganlar", "Faqat soliq to‘lovchilar bo‘lgan", "Ularga mamlakatdan chiqish taqiqlangan"], ans: 1, exp: "Husnixat san’atini egallaganlar yuksak savodxon sanalib, katta imtiyoz va hurmatga ega bo‘lgan." },
            { q: "Misrliklarning matematik bilimlari darajasi qaysi javobda to‘g‘ri ifodalangan?", opts: ["Faqat 10 gacha sanashni bilishgan", "Oddiy arifmetika bilan birga kasrlar, maxrajlar va murakkab hisob-kitoblarni bilishgan", "Faqat ko‘paytirish amalini bilishgan", "Matematikani bilishmagan"], ans: 1, exp: "Misrliklar oddiy hisoblash bilan birga kasrlar, maxrajlar va murakkab hisob-kitoblarni bilishgan." },
            { q: "Qadimgi Misrda qora va boshqa rangli siyohlar qanday ashyolardan tayyorlangan?", opts: ["O‘simlik sharbatidan", "Turli rangdagi mineral bo‘yoqlardan", "Hayvon qonidan", "Daryo loyidan"], ans: 1, exp: "Turli rangdagi mineral bo‘yoqlar siyoh vazifasini o‘tagan." },
            { q: "Shampolyon kashfiyotining jahon tarixshunosligi uchun ahamiyati nimada?", opts: ["Yangi piramidalar topildi", "Qadimgi Misr yozuvlari «tilga kirib», sivilizatsiyani o‘rganish uchun ishonchli manba paydo bo‘ldi", "Misr alifbosi butun dunyoga tarqaldi", "Yunon tili yo‘qolib ketdi"], ans: 1, exp: "Piramida va papiruslardagi bitiklar «tilga kirdi» va Misr tarixini o‘rganishga ishonchli asos yaratildi." },
            { q: "Qadimgi Misr madaniy yutuqlari va ularning sohasi to‘g‘ri juftlangan qatorni toping:", opts: ["365 kunlik taqvim — Geometriya; Suv soati — Tibbiyot", "365 kunlik taqvim — Astronomiya; Maydon o‘lchash — Geometriya; Mumiyolash — Tibbiyot", "Iyeroglif — Matematika; Podsho tirsagi — Astronomiya", "Suv soati — Botanika; Kasrlar — Tilshunoslik"], ans: 1, exp: "Taqvim — astronomiya, maydon o‘lchovi — geometriya, mumiyolash va giyohlar — tibbiyot yutug‘idir." }
        ];

        let currentIndex = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            const t = tests[currentIndex];
            document.getElementById('question').innerText = t.q;
            document.getElementById('counter').innerText = `${currentIndex + 1} / ${tests.length}`;

            for (let i = 0; i < 4; i++) {
                document.getElementById(`opt-text-${i}`).innerText = t.opts[i];
                const card = document.querySelectorAll('.option-card')[i];
                card.className = 'option-card';
            }

            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
        }

        function selectOption(index) {
            if (answered) return;
            answered = true;

            const t = tests[currentIndex];
            const cards = document.querySelectorAll('.option-card');

            cards.forEach(card => card.classList.add('disabled'));

            if (index === t.ans) {
                cards[index].classList.add('correct');
                score++;
                playSuccess();
            } else {
                cards[index].classList.add('wrong');
                cards[t.ans].classList.add('correct');
                playFail();
            }

            const expBox = document.getElementById('explanation');
            expBox.innerText = t.exp;
            expBox.style.display = 'block';

            const nextBtn = document.getElementById('next-btn');
            if (currentIndex === tests.length - 1) {
                nextBtn.innerText = "Natijani ko‘rish 🏁";
            } else {
                nextBtn.innerText = "Keyingi savol ➔";
            }
            nextBtn.style.display = 'block';
        }

        function nextQuestion() {
            if (currentIndex < tests.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-header').style.display = 'none';
            document.getElementById('quiz-box').style.display = 'none';

            const resultBox = document.getElementById('result-box');
            resultBox.style.display = 'flex';

            document.getElementById('score-text').innerText = `${score} / ${tests.length}`;
            const percent = Math.round((score / tests.length) * 100);
            document.getElementById('percent-text').innerText = `Ko‘rsatkich: ${percent}%`;

            let feedback = "";
            if (percent >= 90) {
                feedback = "Ajoyib natija! Mavzuni 100% mukammal o‘zlashtiribsiz! 🌟";
            } else if (percent >= 70) {
                feedback = "Yaxshi natija! Xatolaringiz ustida yana bir bor ishlab chiqing. 👍";
            } else {
                feedback = "Mavzuni qaytadan o‘qib chiqish tavsiya etiladi. 📚";
            }
            document.getElementById('feedback-text').innerText = feedback;
        }

        function restartQuiz() {
            currentIndex = 0;
            score = 0;
            document.getElementById('quiz-header').style.display = 'flex';
            document.getElementById('quiz-box').style.display = 'flex';
            document.getElementById('result-box').style.display = 'none';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
