document.getElementById('reveal').onclick=()=>{document.getElementById('cardAnswer').style.display='block';document.getElementById('reveal').style.display='none';document.getElementById('nextCard').style.display='block'};document.getElementById('nextCard').onclick=()=>{ci++;if(ci<cards.length)loadCard();else{document.getElementById('cardPlay').style.display='none';document.getElementById('cardDone').classList.add('show')}window.scrollTo({top:0,behavior:'smooth'})};function restartCards(){ci=0;document.getElementById('cardPlay').style.display='block';document.getElementById('cardDone').classList.remove('show');loadCard()}
function loadQuiz(){const q=quiz[qi],rows=shuf(q[1].map((t,i)=>({t,ok:i===q[2]})));document.getElementById('quizCount').textContent=(qi+1)+' / '+quiz.length;document.getElementById('quizProgress').style.width=(qi/quiz.length*100)+'%';document.getElementById('quizQuestion').textContent=q[0];const box=document.getElementById('quizOptions');box.innerHTML='';rows.forEach((r,i)=>{const b=document.createElement('button');b.className='option';b.textContent=L[i]+'. '+r.t;b.onclick=()=>answerQuiz(b,r.ok,rows,q[3]);box.appendChild(b)});document.getElementById('explain').style.display='none';document.getElementById('sticky').style.display='none'}
function answerQuiz(chosen,ok,rows,ex){const bs=[...document.querySelectorAll('.option')];bs.forEach((b,i)=>{b.disabled=true;if(rows[i].ok)b.classList.add('correct')});if(ok)points++;else chosen.classList.add('incorrect');const e=document.getElementById('explain');e.textContent='Izoh: '+ex;e.style.display='block';document.getElementById('sticky').style.display='flex'}
function nextQuiz(){qi++;if(qi<quiz.length){loadQuiz();window.scrollTo({top:0,behavior:'smooth'})}else{document.getElementById('quizPlay').style.display='none';document.getElementById('sticky').style.display='none';document.getElementById('quizDone').classList.add('show');document.getElementById('score').textContent=points+'/'+quiz.length;document.getElementById('feedback').textContent=points>=20?'Juda yaxshi natija!':points>=14?'Yaxshi natija. Izohlarni yana bir bor takrorlang.':'Savol-javob bo‘limini qayta takrorlang.'}}
function restartQuiz(){qi=0;points=0;document.getElementById('quizPlay').style.display='block';document.getElementById('quizDone').classList.remove('show');loadQuiz()}
initMatch();loadCard();loadQuiz();
</script>
