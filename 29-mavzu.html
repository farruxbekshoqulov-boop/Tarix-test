function shuf(a){return a.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x)}
function openPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelector('[data-page="'+id+'"]').classList.add('active');document.getElementById('sticky').style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>openPage(b.dataset.page));
function initMatch(){ms=0;document.getElementById('matchPlay').style.display='block';document.getElementById('matchDone').classList.remove('show');loadMatch()}
function loadMatch(){const s=stages[ms];remain=s.length;sel=null;document.getElementById('matchBadge').textContent='Bosqich: '+(ms+1)+' / '+stages.length;document.getElementById('matchCount').textContent='Qoldi: '+remain+' juftlik';document.getElementById('matchProgress').style.width=(ms/stages.length*100)+'%';const arr=[];s.forEach((p,i)=>{arr.push({id:i,t:p.a});arr.push({id:i,t:p.b})});const box=document.getElementById('matchGrid');box.innerHTML='';shuf(arr).forEach(x=>{const b=document.createElement('button');b.className='match';b.textContent=x.t;b.dataset.id=x.id;b.onclick=()=>choose(b);box.appendChild(b)})}
function choose(b){if(b.classList.contains('good')||b===sel)return;if(!sel){sel=b;b.classList.add('selected');return}if(sel.dataset.id===b.dataset.id){b.classList.add('good');sel.classList.remove('selected');sel.classList.add('good');sel=null;remain--;document.getElementById('matchCount').textContent='Qoldi: '+remain+' juftlik';if(remain===0)setTimeout(()=>{ms++;if(ms<stages.length)loadMatch();else{document.getElementById('matchProgress').style.width='100%';document.getElementById('matchPlay').style.display='none';document.getElementById('matchDone').classList.add('show')}},450)}else{const old=sel;old.classList.add('bad');b.classList.add('bad');setTimeout(()=>{old.classList.remove('bad','selected');b.classList.remove('bad');sel=null},600)}}
function loadCard(){let c=cards[ci];document.getElementById('cardCount').textContent=(ci+1)+' / '+cards.length;document.getElementById('cardProgress').style.width=(ci/cards.length*100)+'%';document.getElementById('cardQuestion').textContent=c[0];document.getElementById('cardAnswer').textContent=c[1];document.getElementById('cardAnswer').style.display='none';document.getElementById('reveal').style.display='block';document.getElementById('nextCard').style.display='none'}
document.getElementById('reveal').onclick=()=>{document.getElementById('cardAnswer').style.display='block';document.getElementById('reveal').style.display='none';document.getElementById('nextCard').style.display='block'};document.getElementById('nextCard').onclick=()=>{ci++;if(ci<cards.length)loadCard();else{document.getElementById('cardPlay').style.display='none';document.getElementById('cardDone').classList.add('show')}window.scrollTo({top:0,behavior:'smooth'})};function restartCards(){ci=0;document.getElementById('cardPlay').style.display='block';document.getElementById('cardDone').classList.remove('show');loadCard()}
function loadQuiz(){const q=quiz[qi],rows=shuf(q[1].map((t,i)=>({t,ok:i===q[2]})));document.getElementById('quizCount').textContent=(qi+1)+' / '+quiz.length;document.getElementById('quizProgress').style.width=(qi/quiz.length*100)+'%';document.getElementById('quizQuestion').textContent=q[0];const box=document.getElementById('quizOptions');box.innerHTML='';rows.forEach((r,i)=>{const b=document.createElement('button');b.className='option';b.textContent=L[i]+'. '+r.t;b.onclick=()=>answerQuiz(b,r.ok,rows,q[3]);box.appendChild(b)});document.getElementById('explain').style.display='none';document.getElementById('sticky').style.display='none'}
function answerQuiz(chosen,ok,rows,ex){const bs=[...document.querySelectorAll('.option')];bs.forEach((b,i)=>{b.disabled=true;if(rows[i].ok)b.classList.add('correct')});if(ok)points++;else chosen.classList.add('incorrect');const e=document.getElementById('explain');e.textContent='Izoh: '+ex;e.style.display='block';document.getElementById('sticky').style.display='flex'}
function nextQuiz(){qi++;if(qi<quiz.length){loadQuiz();window.scrollTo({top:0,behavior:'smooth'})}else{document.getElementById('quizPlay').style.display='none';document.getElementById('sticky').style.display='none';document.getElementById('quizDone').classList.add('show');document.getElementById('score').textContent=points+'/'+quiz.length;document.getElementById('feedback').textContent=points>=20?'Juda yaxshi natija!':points>=14?'Yaxshi natija. Izohlarni yana bir bor takrorlang.':'Savol-javob bo‘limini qayta takrorlang.'}}
function restartQuiz(){qi=0;points=0;document.getElementById('quizPlay').style.display='block';document.getElementById('quizDone').classList.remove('show');loadQuiz()}
initMatch();loadCard();loadQuiz();
</script>
