der:2px dashed #ffffff38;border-radius:18px;padding:17px;display:flex;flex-direction:column;justify-content:center;text-align:center;background:#0f172a8c}.q{font-size:17px;font-weight:800;line-height:1.4}.ans,.exp{display:none;margin-top:13px;padding:12px;border-radius:12px;background:#064e3b99;color:#c9fbe6;border:1px solid #34d39966;font-size:15px;line-height:1.4;font-weight:700}.opts{display:grid;gap:8px}.opt{text-align:left}.opt.good{border-color:var(--g);background:#10b98159;color:#a7f3d0}.exp{display:block;background:#3b82f633;border:0;border-left:4px solid var(--p);color:#bfdbfe;font-size:13.5px}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:800;margin-top:8px}.sticky{display:none;position:fixed;bottom:0;left:0;right:0;background:#0f172af5;padding:10px 16px 14px}.sticky .btn{max-width:540px;display:block;margin:auto}.finish{display:none;text-align:center;padding:25px 4px}.finish.on{display:block}.score{margin:0 auto 12px;width:75px;height:75px;border-radius:50%;border:3px solid var(--p);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#93c5fd}@media(max-width:400px){.cols{gap:5px}.match{font-size:12px;padding:7px 4px}}</style></head><body><main class="app"><h1>III bo‘lim. Qadimgi Yunoniston — umumiy takrorlash</h1><nav class="nav"><button class="tab on" data-p="m">🧩 Moslash</button><button class="tab" data-p="c">🧠 Savol-javob</button><button class="tab" data-p="t">📝 Test</button></nav><section id="m" class="page on"><div id="mp"><div class="head"><span id="mb" class="badge"></span><span id="mc" class="count"></span></div><div class="bar"><div id="mf" class="fill"></div></div><p class="hint">Chapdagi atama va o‘ngdagi mos izohni bosing. Xato juftlik qizil bo‘ladi.</p><div class="cols"><div><p class="coltitle">Atamalar</p><div id="ml" class="list"></div></div><div><p class="coltitle">Izohlar</p><div id="mr" class="list"></div></div></div></div><div id="md" class="finish"><div class="score">✓</div><h2>Moslashtirish tugadi!</h2><button class="btn" onclick="openP('c')">Savol-javobga o‘tish</button></div></section><section id="c" class="page"><div id="cp"><div class="head"><span class="badge">III bo‘lim trenajyor</span><span id="cc" class="count"></span></div><div class="bar"><div id="cf" class="fill"></div></div><div class="card"><div id="cq" class="q"></div><div id="ca" class="ans"></div></div><button id="show" class="btn">Javobni ko‘rish</button><button id="nextc" class="btn" style="display:none">Keyingi savol ➔</button></div><div id="cd" class="finish"><div class="score">✓</div><h2>40 ta savol tugadi!</h2><button class="btn" onclick="openP('t')">Testga o‘tish</button></div></section><section id="t" class="page"><div id="tp"><div class="head"><span class="badge">III bo‘lim katta test</span><span id="tc" class="count"></span></div><div class="bar"><div id="tf" class="fill"></div></div><div id="tq" class="q"></div><div id="to" class="opts"></div><div id="te" class="exp"></div></div><div id="td" class="finish"><div id="score" class="score"></div><h2>Takrorlash yakunlandi!</h2><p id="fb" class="hint"></p><button class="btn" onclick="restartT()">Testni qayta ishlash</button></div></section></main><div id="stick" class="sticky"><button class="btn" onclick="nextT()">Keyingi savol ➔</button></div><script>'use strict';const L=['A','B','C','D'];const facts=[['Olimp tog‘i','Yunonistonning shimoli-sharqidagi eng baland cho‘qqi'],['Minoy sivilizatsiyasi','Krit orolida Minos nomi bilan atalgan sivilizatsiya'],['Axeylar','Minoy sivilizatsiyasi barbod bo‘lishini nihoyasiga yetkazgan qabilalar'],['Doriylar','Miken davlatining tugatilishi va Sparta vujudga kelishiga sabab bo‘lgan qabilalar'],['Polis','Yunoncha shahar ma’nosidagi shahar-davlat'],['Akropol','Afinadagi yuqori shahar deb atalgan qal’a'],['Ilotlar','Spartaliklar qulga aylantirgan mahalliy aholi'],['Periyeklar','Spartada to‘la-to‘kis huquqlarga ega bo‘lmagan fuqarolar'],['Ellinlar','Yunonlar o‘zini yagona xalq deb hisoblagan nom'],['Ellada','Yunonlar o‘z vatanini atagan nom'],['Drakont','Miloddan avvalgi 621-yilda qonunlar yozgan qonunchi'],['Solon','Miloddan avvalgi 594-yilda qarz qulligini bekor qilgan islohotchi'],['Marafon','Miloddan avvalgi 490-yilda birinchi yunon-fors jangi bo‘lgan tekislik'],['Fermopil','Leonid boshchiligidagi spartaliklar jasorati bilan bog‘liq dara'],['Salamin','Miloddan avvalgi 480-yilda hal qiluvchi dengiz jangi bo‘lgan bo‘g‘oz'],['Xeroniya','Miloddan avvalgi 338-yilda yunonlar mag‘lub bo‘lgan joy'],['Palestra','Puldor ota-onalar farzandlari tahsil olgan xususiy gimnastika maktabi'],['Gomer','Iliada va Odisseya dostonlarini yozgan shoir'],['Sofokl','Shoh Edip va Antigona tragediyalari muallifi'],['Aristofan','Mashhur komediyalar muallifi'],['Fidiy','Parfenon qurilishiga boshchilik qilgan haykaltarosh'],['Arximed','Richag qonunini ishlab chiqqan fizik va matematik'],['Gerodot','Yunon-fors urushlari haqida Tarix yozgan tarixning otasi'],['Zevs','Osmonda hukmronlik qilgan oliy xudo']];const Q=[['Qadimgi Yunoniston qaysi yarimorol va orollarni o‘z ichiga olgan?','Bolqon yarimoroli va O‘rta Yer dengizi orollarini.'],['Minoy sivilizatsiyasi qaysi orolda shakllangan?','Krit orolida.'],['Miken davlati tugatilishi va Sparta vujudga kelishiga nima sabab bo‘lgan?','Doriy qabilalarining Janubiy Yunonistonga bostirib kirishi.'],['Yunon shaharlari qanday nomlangan?','Polis deb atalgan.'],['Afina qaysi yarimorolda joylashgan?','Attika yarimorolida.'],['Afinaning asosiy porti nima deb atalgan?','Pirey bandargohi.'],['Sparta qaysi o‘lkada joylashgan?','Lakonikada.'],['Ilotlar kimning mulki sanalgan?','Alohida kishilarning emas, balki butun davlatning mulki.'],['Buyuk Yunon koloniyalashtirishi qachon yuz bergan?','Miloddan avvalgi VIII–VI asrlarda.'],['Yunonlar o‘zlarini nima deb atagan?','Ellinlar deb atagan.'],['Drakont qonunlarida qanday jazo belgilangan?','O‘lim jazosi.'],['Solon qachon islohot o‘tkazgan?','Miloddan avvalgi 594-yilda.'],['Demokratiya nimani anglatadi?','Xalq hokimiyatini.'],['Xalq majlisida erkak fuqarolar necha yoshdan qatnashgan?','20 yoshdan.'],['Perikl qachon hukmronlik qilgan?','Miloddan avvalgi 443–429-yillarda.'],['Marafon jangi qachon bo‘lgan?','Miloddan avvalgi 490-yilda.'],['Fermopil darasini kim himoya qilgan?','Sparta podshosi Leonid.'],['Salamin jangi qachon bo‘lgan?','Miloddan avvalgi 480-yilda.'],['Yunon-fors urushlari qaysi sulh bilan yakunlangan?','Miloddan avvalgi 449-yildagi sulh bilan.'],['Xeroniya jangidan so‘ng Yunoniston qanday ahvolda qoldi?','Makedoniyaga qaram bo‘lib qoldi.'],['Birinchi Olimpiya o‘yinlari qachon o‘tkazilgan?','Miloddan avvalgi 776-yilda.'],['Olimpiya o‘yinlari kim sharafiga o‘tkazilgan?','Zevs sharafiga.'],['Gomer qaysi dostonlarni yozgan?','Iliada va Odisseya dostonlarini.'],['Troya oti iborasi nimani anglatadi?','Xosiyatsiz sovg‘a-salomni.'],['Sofokl qaysi asarlarni yozgan?','Shoh Edip va Antigona tragediyalarini.'],['Komediya muallifi kim edi?','Aristofan.'],['Parfenon qurilishiga kim boshchilik qilgan?','Fidiy.'],['Geraklit nimani hamma narsaning asosi degan?','Olovni.'],['Demokrit fikricha dunyo nimadan tashkil topgan?','Atomlardan.'],['Arximed qaysi shaharni himoya qilgan?','Sirakuzani.'],['Gerodot qaysi urushlar haqida Tarix yozgan?','Yunon-fors urushlari haqida.'],['Afsonalar yunon tilida nima deb ataladi?','Mif deb ataladi.'],['Atlant nima qilgan titan sifatida tasvirlangan?','Osmon gumbazini yelkasida suyab turgan titan sifatida.'],['Poseydon qayerda hukmronlik qilgan?','Dengizda.'],['Aid qayerda hukmronlik qilgan?','Marhumlar saltanatida.'],['Sirenlar qanday mavjudotlar edi?','Yarim qush, yarim ayollar.'],['Kentavrlar qanday mavjudotlar edi?','Yarim ot, yarim odam.'],['Sikloplar qanday mavjudotlar edi?','Peshonasida bitta ko‘zi bo‘lgan baqaybat mavjudotlar.'],['Yunonlar xudolar sharafiga nima qilgan?','Ibodatxonalar barpo etib, qurbonliklar qilgan.'],['Olimp ma’budlari qayerda yashagan deb tasavvur qilingan?','Shimoliy Yunonistondagi Olimp tog‘ida.']];const T=Q.map((x,i)=>[x[0],[x[1],Q[(i+7)%Q.length][1],Q[(i+16)%Q.length][1],Q[(i+27)%Q.length][1]],0,'To‘g‘ri javob: '+x[1]]);let si=0,sel=null,rem=0,ci=0,ti=0,scoreN=0;function mix(a){return a.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x)}function openP(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelector('[data-p="'+id+'"]').classList.add('on');stick.style.display='none'}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>openP(x.dataset.p));function initM(){si=0;mp.style.display='block';md.classList.remove('on');loadM()}function loadM(){let a=facts.slice(si*4,si*4+4);rem=a.length;sel=null;mb.textContent='Bosqich: '+(si+1)+' / 6';mc.textContent='Qoldi: '+rem+' juftlik';mf.style.width=(si/6*100)+'%';ml.innerHTML='';mr.innerHTML='';a.forEach((x,i)=>ml.appendChild(make(x[0],i)));mix(a.map((x,i)=>({t:x[1],i}))).forEach(x=>mr.appendChild(make(x.t,x.i)))}function make(t,i){let b=document.createElement('button');b.className='match';b.textContent=t;b.dataset.i=i;b.onclick=()=>pick(b);return b}function pick(b){if(b.classList.contains('ok')||b===sel)return;if(!sel){sel=b;b.classList.add('sel');return}if(sel.dataset.i===b.dataset.i&&sel.parentElement!==b.parentElement){b.classList.add('ok');sel.classList.remove('sel');sel.classList.add('ok');sel=null;rem--;mc.textContent='Qoldi: '+rem+' juftlik';if(!rem)setTimeout(()=>{si++;if(si<6)loadM();else{mf.style.width='100%';mp.style.display='none';md.classList.add('on')}},350)}else{let a=sel;a.classList.add('bad');b.classList.add('bad');setTimeout(()=>{a.classList.remove('bad','sel');b.classList.remove('bad');sel=null},500)}}function loadC(){let x=Q[ci];cc.textContent=(ci+1)+' / '+Q.length;cf.style.width=(ci/Q.length*100)+'%';cq.textContent=x[0];ca.textContent=x[1];ca.style.display='none';show.style.display='block';nextc.style.display='none'}show.onclick=()=>{ca.style.display='block';show.style.display='none';nextc.style.display='block'};nextc.onclick=()=>{ci++;if(ci<Q.length)loadC();else{cp.style.display='none';cd.classList.add('on')}};function restartC(){ci=0;cp.style.display='block';cd.classList.remove('on');loadC()}function loadT(){let q=T[ti],rows=mix(q[1].map((t,i)=>({t,ok:i===0})));tc.textContent=(ti+1)+' / '+T.length;tf.style.width=(ti/T.length*100)+'%';tq.textContent=q[0];to.innerHTML='';rows.forEach((r,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=L[i]+'. '+r.t;b.onclick=()=>answer(b,r.ok,rows,q[3]);to.appendChild(b)});te.style.display='none';stick.style.display='none'}function answer(ch,ok,rows,ex){let bs=[...document.querySelectorAll('.opt')];bs.forEach((b,i)=>{b.disabled=true;if(rows[i].ok)b.classList.add('good')});if(ok)scoreN++;else ch.classList.add('bad');te.textContent='Izoh: '+ex;te.style.display='block';stick.style.display='flex'}function nextT(){ti++;if(ti<T.length)loadT();else{tp.style.display='none';stick.style.display='none';td.classList.add('on');score.textContent=scoreN+'/'+T.length;fb.textContent=scoreN>=34?'Juda yaxshi natija!':scoreN>=24?'Yaxshi natija.':'Mavzularni yana takrorlang.'}}function restartT(){ti=0;scoreN=0;tp.style.display='block';td.classList.remove('on');loadT()}initM();loadC();loadT();</script></body></html>
