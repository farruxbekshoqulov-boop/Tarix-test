<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>31-§. Qadimgi Yunoniston olimlari va mutafakkirlari</title><style>:root{--p:#3b82f6;--a:#8b5cf6;--g:#10b981;--r:#ef4444;--t:#fff;--m:#94a3b8;--c:rgba(30,41,59,.95);--l:rgba(255,255,255,.16)}*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}html,body{min-height:100%;background:radial-gradient(circle at top right,#1e1b4b,#0f172a 60%,#020617);color:var(--t)}body{display:flex;justify-content:center;padding:10px 10px 100px}.app{width:100%;max-width:540px;background:var(--c);border:1.5px solid var(--l);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 45px #0008}h1{font-size:21px;line-height:1.2}.nav{display:flex;gap:4px;padding:4px;border-radius:14px;background:#0f172ab3;border:1px solid #ffffff1a}.tab{flex:1;border:0;border-radius:10px;padding:10px 2px;background:transparent;color:var(--m);font-size:13px;font-weight:800;cursor:pointer}.tab.on{background:linear-gradient(135deg,var(--p),var(--a));color:#fff}.page{display:none;flex-direction:column;gap:10px}.page.on{display:flex}.head{display:flex;justify-content:space-between;align-items:center}.badge{padding:4px 11px;border-radius:20px;background:#3b82f640;border:1px solid #3b82f666;color:#93c5fd;font-size:12px;font-weight:800}.count{font-size:13px;font-weight:800;color:var(--m)}.progress{height:7px;border-radius:99px;background:#ffffff1f;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#818cf8);transition:.25s}.hint{font-size:13px;color:var(--m);line-height:1.35}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.match{min-height:58px;padding:10px 7px;border:2px solid var(--l);border-radius:12px;background:#1e293bf2;color:#fff;font-size:13.5px;font-weight:700;line-height:1.25;cursor:pointer}.match.sel{border-color:#38bdf8;background:#38bdf840}.match.ok{visibility:hidden;opacity:0;background:#10b9814d;border-color:var(--g)}.match.bad{background:#ef44444d;border-color:var(--r)}.card{min-height:185px;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:17px;border:2px dashed #ffffff38;border-radius:18px;background:#0f172a8c}.q{font-size:17px;line-height:1.4;font-weight:800}.ans{display:none;margin-top:13px;padding:12px;border-radius:12px;background:#064e3b99;border:1px solid #34d39966;color:#c9fbe6;font-size:15px;font-weight:700;line-height:1.4}.btn{width:100%;border:0;border-radius:14px;padding:14px;background:linear-gradient(135deg,var(--p),var(--a));color:#fff;font-size:16px;font-weight:800;cursor:pointer}.opts{display:flex;flex-direction:column;gap:8px}.opt{padding:12px 14px;text-align:left;border:1.5px solid var(--l);border-radius:12px;background:#0f172ad9;color:#f1f5f9;font-size:14.5px;font-weight:600;line-height:1.35;cursor:pointer}.opt.good{background:#10b98159!important;border-color:var(--g)!important;color:#a7f3d0!important}.opt.bad{background:#ef444459!important;border-color:var(--r)!important;color:#fecaca!important}.exp{display:none;margin-top:7px;padding:10px 12px;border-left:4px solid var(--p);border-radius:8px;background:#3b82f633;color:#bfdbfe;font-size:13.5px;line-height:1.4}.finish{display:none;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:22px 0}.finish.on{display:flex}.score{width:75px;height:75px;border:3px solid var(--p);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#93c5fd;background:#3b82f640}.sticky{position:fixed;bottom:0;left:0;right:0;display:none;justify-content:center;padding:10px 16px 14px;background:#0f172af5;border-top:1px solid #ffffff26;z-index:9}.sticky .btn{max-width:540px}@media(max-width:420px){body{padding:7px 7px 92px}.app{padding:12px;border-radius:18px}h1{font-size:19px}.tab{font-size:12px}.match{font-size:13px;min-height:54px}.q{font-size:16px}.opt{font-size:14px}}</style></head><body><main class="app"><h1>31-§. Qadimgi Yunoniston olimlari va mutafakkirlari</h1><nav class="nav"><button class="tab on" data-p="m">🧩 Moslash</button><button class="tab" data-p="c">🧠 Savol-javob</button><button class="tab" data-p="t">📝 Test</button></nav><section id="m" class="page on"><div id="mp"><div class="head"><span id="mb" class="badge"></span><span id="mc" class="count"></span></div><div class="progress"><div id="mf" class="fill"></div></div><p class="hint">Tushuncha va mos izohni tanlang. Xato juftlik qizil bo‘ladi.</p><div id="mg" class="grid"></div></div><div id="md" class="finish"><div class="score">✓</div><h2>4 ta bosqich yakunlandi!</h2><button class="btn" onclick="openP('c')">Savol-javobga o‘tish</button><button class="btn" onclick="initM()">Qaytadan moslash</button></div></section><section id="c" class="page"><div id="cp"><div class="head"><span class="badge">31-§ Trenajyor</span><span id="cc" class="count"></span></div><div class="progress"><div id="cf" class="fill"></div></div><div class="card"><div id="cq" class="q"></div><div id="ca" class="ans"></div></div><button id="show" class="btn">👁 Javobni ko‘rish</button><button id="nextc" class="btn" style="display:none">Keyingi savol ➔</button></div><div id="cd" class="finish"><div class="score">✓</div><h2>20 ta savol tugadi!</h2><button class="btn" onclick="openP('t')">Test sinoviga o‘tish</button><button class="btn" onclick="restartC()">Qaytadan takrorlash</button></div></section><section id="t" class="page"><div id="tp"><div class="head"><span class="badge">31-§ Test sinovi</span><span id="tc" class="count"></span></div><div class="progress"><div id="tf" class="fill"></div></div><div id="tq" class="q"></div><div id="to" class="opts"></div><div id="te" class="exp"></div></div><div id="td" class="finish"><div id="score" class="score"></div><h2>Sinov yakunlandi!</h2><p id="fb" class="hint"></p><button class="btn" onclick="restartT()">Testni qayta ishlash</button><button class="btn" onclick="initM();openP('m')">Boshidan boshlash</button></div></section></main><div id="stick" class="sticky"><button class="btn" onclick="nextT()">Keyingi savol ➔</button></div><script>'use strict';const L=['A','B','C','D'];const S=[[['Geraklit','Yer yuzidagi hamma narsa olovdan kelib chiqqan degan faylasuf'],['Demokrit','Dunyo atomlardan tashkil topgan degan Frakiyalik faylasuf'],['Diogen','Hayotdagi barcha qulayliklardan voz kechib, bochkada kun kechirgan faylasuf'],['Donishmandlar, hayot murabbiylari','Qadimgi yunonlar olimlarni atagan nom']],[['Bir daryoga ikki marta tushib bo‘lmas','Geraklitning hamma narsa o‘zgaruvchanligi haqidagi hikmati'],['Nariroq tur, quyoshni to‘syapsan!','Diogenning Makedoniyalik Aleksandrga aytgan gapi'],['Evrika!','Arximedning “Topdim!” ma’nosidagi qiyqirig‘i'],['Richag qonuni','Arximed ishlab chiqqan dastak qonuni']],[['Arximed','Qadimgi yunon fizigi va matematigi'],['Ko‘zgu orqali yorug‘likni jamlash','Arximed rimliklar kemalarini yondirishda foydalangan usul'],['Sirakuza','Arximed tug‘ilib o‘sgan va himoya qilgan shahar'],['Menga tayanch nuqtasini topib bering','Arximedning richag qonuniga oid mashhur iborasi']],[['Gerodot','Yunon-fors urushlariga bag‘ishlab “Tarix” yozgan olim'],['Miloddan avvalgi V asr','Gerodot yashagan davr'],['Tarixning otasi','Gerodotga berilgan nom'],['Olam tuzilishi va inson hayoti ma’nosi','Yunon mutafakkirlari tushuntirishga harakat qilgan masalalar']]];const C=[['Qadimgi Yunonistonda olimlarni qanday atashgan?','Donishmandlar, hayot murabbiylari sifatida bilishgan.'],['Yunon mutafakkirlari nimani tushuntirishga harakat qilgan?','Olam tuzilishi va inson hayoti ma’nosini.'],['Yer yuzidagi hamma narsa olovdan kelib chiqqan deb uqtirgan faylasuf kim?','Geraklit.'],['Geraklitning “Bir daryoga ikki marta tushib bo‘lmas” hikmati nimani ifodalaydi?','Hamma narsa oqadi, hamma narsa o‘zgaruvchandir.'],['Demokrit qaysi o‘lkaning faylasufi bo‘lgan?','Frakiyalik faylasuf.'],['Demokritning fikricha dunyo nimadan tashkil topgan?','Ko‘zga ko‘rinmaydigan mayda zarrachalar — atomlardan.'],['Diogen hayotdagi nimadan voz kechgan va qayerda kun kechirgan?','Hayotdagi barcha qulayliklardan voz kechib, bir bochkada kun kechirgan.'],['Diogen Makedoniyalik Aleksandrga nima degan?','“Nariroq tur, quyoshni to‘syapsan!” degan.'],['“Evrika!” so‘zining ma’nosi nima?','“Topdim!” degan ma’noni anglatadi.'],['“Evrika!” deb qiyqirgan yunon fizigi va matematigi kim?','Arximed.'],['Arximed rimliklar kemalarini qanday yondirib yuborgan?','Yorug‘likni ko‘zgu orqali jamlab.'],['Arximed qaysi shaharni rimliklar hujumidan himoya qilgan?','O‘zining tug‘ilib o‘sgan Sirakuza shahrini.'],['Arximed qaysi qonunni ishlab chiqqan?','Richag (dastak) qonunini.'],['Arximedning tayanch nuqtasi haqidagi iborasi nimaga oid?','Richag (dastak) qonuniga oid.'],['Gerodot qachon yashagan?','Miloddan avvalgi V asrda.'],['Gerodot qaysi urushlarga bag‘ishlab “Tarix” kitobini yozgan?','Yunon-fors urushlariga.'],['Gerodotning kitobi nima deb nomlangan?','“Tarix”.'],['Qadimda Gerodotga qanday nom berilgan?','“Tarixning otasi”.'],['Gerodotning “Tarix” kitobi unga nima keltirgan?','Birdaniga mashhurlik keltirgan.'],['Diogenning “Insonda hech qanday ehtiyojlar bo‘lmasligi shart” degan gapi uning qanday hayotini ifodalaydi?','Hayotdagi barcha qulayliklardan voz kechgan hayotini.']];const T=[['Geraklit nimani yer yuzidagi hamma narsaning asosi deb hisoblagan?',['Olovni','Atomlarni','Ko‘zguni','Richagni'],0,'Geraklit yer yuzidagi hamma narsa olovdan kelib chiqqan deb uqtirgan.'],['Dunyo atomlardan tashkil topgan degan fikr kimga tegishli?',['Geraklitga','Demokritga','Diogenga','Gerodotga'],1,'Frakiyalik Demokrit dunyo atomlardan tashkil topgan degan fikrni bayon etgan.'],['“Bir daryoga ikki marta tushib bo‘lmas” degan hikmat kimga tegishli?',['Diogenga','Arximedga','Geraklitga','Gerodotga'],2,'Bu mashhur hikmat Geraklitga tegishli.'],['Diogen qayerda kun kechirgan?',['Sirakuzada','Tarix kitobida','Ko‘zgu yonida','Bir bochkada'],3,'Diogen hayotdagi barcha qulayliklardan voz kechib, bir bochkada kun kechirgan.'],['Diogen Makedoniyalik Aleksandrga nima degan?',['Nariroq tur, quyoshni to‘syapsan!','Evrika!','Bir daryoga ikki marta tushib bo‘lmas','Menga tayanch nuqtasini topib bering'],0,'Diogen Aleksandrga “Nariroq tur, quyoshni to‘syapsan!” deb javob bergan.'],['“Evrika!” kimning qiyqirig‘i?',['Gerodotning','Arximedning','Demokritning','Diogenning'],1,'Arximed ilmiy masala yechimini topganda “Evrika!” deb qiyqirgan.'],['“Evrika!” so‘zi qanday ma’noni anglatadi?',['Hayot murabbiyi','Tarixning otasi','Topdim!','Olovdan kelib chiqqan'],2,'“Evrika!” so‘zi “Topdim!” degan ma’noni anglatadi.'],['Arximed rimliklar kemalarini nima orqali yondirgan?',['Atomlar orqali','Olov orqali','Richag orqali','Ko‘zgu orqali yorug‘likni jamlab'],3,'Arximed yorug‘likni ko‘zgu orqali jamlab kemalarni yondirgan.'],['Arximed qaysi ilm sohalarining vakili bo‘lgan?',['Fizika va matematika','Tarix va hayot murabbiyligi','Olov va atomlar','Daryo va ko‘zgu'],0,'Arximed qadimgi yunon fizigi va matematigi edi.'],['Arximed qaysi qonunni ishlab chiqqan?',['Atom qonunini','Richag (dastak) qonunini','Tarix qonunini','Olov qonunini'],1,'Arximed richag (dastak) qonunini ishlab chiqqan.'],['“Menga tayanch nuqtasini topib bering...” degan ibora kimga tegishli?',['Demokritga','Geraklitga','Arximedga','Diogenga'],2,'Bu ibora Arximedga tegishli.'],['Arximed qaysi shaharni himoya qilgan?',['Frakiyani','Yunon-fors urushlarini','Tarixni','Sirakuzani'],3,'Arximed o‘zining tug‘ilib o‘sgan Sirakuza shahrini himoya qilgan.'],['Gerodot qachon yashagan?',['Miloddan avvalgi V asrda','Miloddan avvalgi 1200-yilda','Milodiy 394-yilda','1896-yilda'],0,'Gerodot miloddan avvalgi V asrda yashagan.'],['Gerodot qaysi urushlarga bag‘ishlab kitob yozgan?',['Yunon-fors urushlariga','Olimpiya o‘yinlariga','Troya urushining o‘ninchi yiliga','Sirakuza mudofaasiga'],0,'Gerodot yunon-fors urushlariga bag‘ishlab kitob yozgan.'],['Gerodotning kitobi nima deb nomlangan?',['Evrika','Tarix','Atomlar','Richag'],1,'Gerodot “Tarix” deb nomlangan kitob yozgan.'],['“Tarixning otasi” degan nom kimga berilgan?',['Diogenga','Gerodotga','Arximedga','Demokritga'],1,'Qadimda Gerodotga “tarixning otasi” degan nom berilgan.'],['Yunon mutafakkirlari nimani tushuntirishga harakat qilgan?',['Olam tuzilishi va inson hayoti ma’nosini','Faqat rimliklar kemalarini','Faqat bochkada yashashni','Faqat kitob nomini'],0,'Yunon mutafakkirlari olam tuzilishi va inson hayoti ma’nosini tushuntirishga harakat qilgan.'],['Qadimgi Yunonistonda olimlar kimlar sifatida bilinardi?',['Donishmandlar, hayot murabbiylari','Faqat kemachilar','Faqat jangchilar','Faqat hukmdorlar'],0,'Qadimgi Yunonistonda olimlarni donishmandlar, hayot murabbiylari sifatida bilishgan.'],['Gerodotning “Tarix” kitobi unga nima keltirgan?',['Birdaniga mashhurlik','Bochkada hayot','Richag qonuni','Ko‘zgu orqali yorug‘lik'],0,'Gerodot shu kitob orqali birdaniga mashhur bo‘lib ketgan.'],['Diogenning hayot tarzi qaysi javobda to‘g‘ri?',['Hayotdagi barcha qulayliklardan voz kechib, bochkada kun kechirgan','Yorug‘likni ko‘zgu orqali jamlagan','Yunon-fors urushlari haqida kitob yozgan','Olamni atomlardan tuzilgan degan'],0,'Diogen hayotdagi barcha qulayliklardan voz kechib, bir bochkada kun kechirgan.']];let si=0,sel=null,rem=0,ci=0,ti=0,score=0;function mix(a){return a.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x)}function openP(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelector('[data-p="'+id+'"]').classList.add('on');stick.style.display='none';window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>openP(x.dataset.p));function initM(){si=0;mp.style.display='block';md.classList.remove('on');loadM()}function loadM(){let a=S[si];rem=a.length;sel=null;mb.textContent='Bosqich: '+(si+1)+' / '+S.length;mc.textContent='Qoldi: '+rem+' juftlik';mf.style.width=(si/S.length*100)+'%';let v=[];a.forEach((x,i)=>{v.push({i,t:x[0]},{i,t:x[1]})});mg.innerHTML='';mix(v).forEach(x=>{let b=document.createElement('button');b.className='match';b.textContent=x.t;b.dataset.i=x.i;b.onclick=()=>pick(b);mg.appendChild(b)})}function pick(b){if(b.classList.contains('ok')||b===sel)return;if(!sel){sel=b;b.classList.add('sel');return}if(sel.dataset.i===b.dataset.i){b.classList.add('ok');sel.classList.remove('sel');sel.classList.add('ok');sel=null;rem--;mc.textContent='Qoldi: '+rem+' juftlik';if(!rem)setTimeout(()=>{si++;if(si<S.length)loadM();else{mf.style.width='100%';mp.style.display='none';md.classList.add('on')}},450)}else{let a=sel;a.classList.add('bad');b.classList.add('bad');setTimeout(()=>{a.classList.remove('bad','sel');b.classList.remove('bad');sel=null},600)}}function loadC(){let x=C[ci];cc.textContent=(ci+1)+' / '+C.length;cf.style.width=(ci/C.length*100)+'%';cq.textContent=x[0];ca.textContent=x[1];ca.style.display='none';show.style.display='block';nextc.style.display='none'}show.onclick=()=>{ca.style.display='block';show.style.display='none';nextc.style.display='block'};nextc.onclick=()=>{ci++;if(ci<C.length)loadC();else{cp.style.display='none';cd.classList.add('on')}window.scrollTo({top:0,behavior:'smooth'})};function restartC(){ci=0;cp.style.display='block';cd.classList.remove('on');loadC()}function loadT(){let q=T[ti],rows=mix(q[1].map((t,i)=>({t,ok:i===q[2]})));tc.textContent=(ti+1)+' / '+T.length;tf.style.width=(ti/T.length*100)+'%';tq.textContent=q[0];to.innerHTML='';rows.forEach((r,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=L[i]+'. '+r.t;b.onclick=()=>answer(b,r.ok,rows,q[3]);to.appendChild(b)});te.style.display='none';stick.style.display='none'}function answer(ch,ok,rows,ex){let bs=[...document.querySelectorAll('.opt')];bs.forEach((b,i)=>{b.disabled=true;if(rows[i].ok)b.classList.add('good')});if(ok)score++;else ch.classList.add('bad');te.textContent='Izoh: '+ex;te.style.display='block';stick.style.display='flex'}function nextT(){ti++;if(ti<T.length){loadT();window.scrollTo({top:0,behavior:'smooth'})}else{tp.style.display='none';stick.style.display='none';td.classList.add('on');score.textContent=score+'/'+T.length;fb.textContent=score>=17?'Juda yaxshi natija!':score>=12?'Yaxshi natija. Izohlarni yana bir bor takrorlang.':'Savol-javob bo‘limini qayta takrorlang.'}}function restartT(){ti=0;score=0;tp.style.display='block';td.classList.remove('on');loadT()}initM();loadC();loadT();</script></body></html>
