<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>33–34-§. Ahamoniylarning O‘rta Osiyoga yurishlari</title><style>:root{--p:#3b82f6;--a:#8b5cf6;--g:#10b981;--r:#ef4444;--m:#94a3b8;--l:#ffffff29}*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{background:radial-gradient(circle at top right,#1e1b4b,#0f172a 60%,#020617);color:#fff;min-height:100vh;padding:10px 10px 95px}.app{max-width:540px;margin:auto;background:#1e293bf2;border:1px solid var(--l);border-radius:24px;padding:14px;box-shadow:0 20px 45px #0008}h1{font-size:20px;line-height:1.2;margin-bottom:12px}.nav{display:flex;gap:4px;padding:4px;background:#0f172ab3;border-radius:14px}.tab{flex:1;border:0;border-radius:10px;padding:10px 2px;background:transparent;color:var(--m);font-weight:800;font-size:13px}.tab.on,.btn{background:linear-gradient(135deg,var(--p),var(--a));color:#fff}.page{display:none;gap:10px}.page.on{display:flex;flex-direction:column}.head{display:flex;justify-content:space-between}.badge{padding:4px 11px;border-radius:20px;background:#3b82f640;color:#93c5fd;font-size:12px;font-weight:800}.count{font-size:13px;color:var(--m);font-weight:800}.bar{height:7px;border-radius:9px;background:#ffffff1f;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#818cf8)}.hint{font-size:13px;color:var(--m);line-height:1.35}.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}.coltitle{text-align:center;color:#93c5fd;font-size:13px;font-weight:800}.list{display:grid;gap:8px}.match,.opt{border:2px solid var(--l);border-radius:12px;background:#0f172ae6;color:#fff;padding:10px 8px;font-size:13px;font-weight:700;line-height:1.25;min-height:56px}.match.sel{border-color:#38bdf8;background:#38bdf840}.match.ok{border-color:var(--g);background:#10b98144;pointer-events:none}.match.bad,.opt.bad{border-color:var(--r);background:#ef44444d}.card{min-height:185px;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:17px;border:2px dashed #ffffff38;border-radius:18px;background:#0f172a8c}.q{font-size:17px;line-height:1.4;font-weight:800}.ans{display:none;margin-top:13px;padding:12px;border-radius:12px;background:#064e3b99;border:1px solid #34d39966;color:#c9fbe6;font-size:15px;font-weight:700;line-height:1.4}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:800;margin-top:8px}.opts{display:grid;gap:8px}.opt{text-align:left}.opt.good{border-color:var(--g);background:#10b98159;color:#a7f3d0}.exp{display:none;margin-top:7px;padding:10px 12px;border-left:4px solid var(--p);background:#3b82f633;color:#bfdbfe;font-size:13px;line-height:1.4}.finish{display:none;text-align:center;padding:25px 4px}.finish.on{display:block}.score{margin:0 auto 12px;width:75px;height:75px;border-radius:50%;border:3px solid var(--p);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#93c5fd}.sticky{display:none;position:fixed;bottom:0;left:0;right:0;background:#0f172af5;padding:10px 16px 14px}.sticky .btn{max-width:540px;display:block;margin:auto}@media(max-width:400px){.match{font-size:12px;padding:7px 4px}}</style></head><body><main class="app"><h1>33–34-§. Ahamoniylarning O‘rta Osiyoga bosqinchilik yurishlari</h1><nav class="nav"><button class="tab on" data-p="m">🧩 Moslash</button><button class="tab" data-p="c">🧠 Savol-javob</button><button class="tab" data-p="t">📝 Test</button></nav><section id="m" class="page on"><div id="mp"><div class="head"><span id="mb" class="badge"></span><span id="mc" class="count"></span></div><div class="bar"><div id="mf" class="fill"></div></div><p class="hint">Atama va mos izohni tanlang. Xato juftlik qizil bo‘ladi.</p><div class="cols"><div><p class="coltitle">Atamalar</p><div id="ml" class="list"></div></div><div><p class="coltitle">Izohlar</p><div id="mr" class="list"></div></div></div></div><div id="md" class="finish"><div class="score">✓</div><h2>Moslashtirish tugadi!</h2><button class="btn" onclick="openP('c')">Savol-javobga o‘tish</button></div></section><section id="c" class="page"><div id="cp"><div class="head"><span class="badge">33–34-§ Trenajyor</span><span id="cc" class="count"></span></div><div class="bar"><div id="cf" class="fill"></div></div><div class="card"><div id="cq" class="q"></div><div id="ca" class="ans"></div></div><button id="show" class="btn">Javobni ko‘rish</button><button id="nextc" class="btn" style="display:none">Keyingi savol ➔</button></div><div id="cd" class="finish"><div class="score">✓</div><h2>28 ta savol tugadi!</h2><button class="btn" onclick="openP('t')">Testga o‘tish</button></div></section><section id="t" class="page"><div id="tp"><div class="head"><span class="badge">33–34-§ Test sinovi</span><span id="tc" class="count"></span></div><div class="bar"><div id="tf" class="fill"></div></div><div id="tq" class="q"></div><div id="to" class="opts"></div><div id="te" class="exp"></div></div><div id="td" class="finish"><div id="score" class="score"></div><h2>Sinov yakunlandi!</h2><p id="fb" class="hint"></p><button class="btn" onclick="restartT()">Testni qayta ishlash</button></div></section></main><div id="stick" class="sticky"><button class="btn" onclick="nextT()">Keyingi savol ➔</button></div><script>'use strict';const L=['A','B','C','D'];const S=[[['Kir II','Miloddan avvalgi 530-yilda massagetlar ustiga yurish qilgan fors hukmdori'],['To‘maris','Massagetlar malikasi'],['Frada','Marg‘iyonadagi qo‘zg‘olonga rahbarlik qilgan shaxs'],['Dadarshish','Doro I chopar yuborgan Baqtriya satrapi']],[['Behistun yozuvlari','Frada qo‘zg‘oloni va Doro I yurishlari qayd etilgan qoyatosh bitiklar'],['Shiroq','Forslarni suvsiz sahroga boshlab borgan sak cho‘poni'],['Poliyen','Shiroq jasorati rivoyatini keltirgan miloddan avvalgi II asr tarixchisi'],['Ranosbat','Shiroq ortidan borgan fors qo‘shinining mingboshisi']],[['Satrapiya','Ahamoniylar davlatidagi alohida viloyat'],['Satrap','Satrapiya hokimi'],['Uchta satrapiya','Forslar bosib olgan O‘rta Osiyo viloyatlari bo‘lingan birliklar'],['Yillik soliq-o‘lpon','Satrapiyalar fors shohiga bajargan majburiyat']],[['Ko‘ktepa, Daratepa, Xumbuztepa','Ahamoniylar davriga oid qadimiy manzilgohlar'],['Amudaryo xazinasi','Qubodiyon vohasidan topilgan oltin-kumush buyumlar majmuasi'],['1877-yil','Amudaryo xazinasi topilgan yil'],['Buyuk Britaniya muzeyi','Amudaryo xazinasi saqlanayotgan joy']],[['Sard va Baqtriya','Suzadagi saroy qurilishi uchun oltin keltirilgan hududlar'],['Sug‘diyona','Suzadagi saroy uchun olmos, la’l va yoqut keltirilgan hudud'],['Xorazm','Suzadagi saroy uchun qo‘llangan to‘q ko‘k yoqut keltirilgan hudud'],['Misr','Suzadagi saroy uchun kumush va jez keltirilgan hudud']],[['Marafon jangi','Miloddan avvalgi 490-yilda saklar muvaffaqiyatli jang qilgan jang'],['Baqtriyaliklar','Kamon va nayzalar bilan jangga kirgan jangchilar'],['Saklar','Xanjar va jangovar boltalar bilan jangga kirgan jangchilar'],['Kserks qo‘shini','Sug‘dlar, baqtriyaliklar va xorazmiylar qatnashgan armiya']]];const C=[['Kir II massagetlar ustiga qachon yurish qilgan?','Miloddan avvalgi 530-yilda.'],['Kir II dastlab O‘rta Osiyoning qaysi hududlarini bosib olgan?','Parfiya, Marg‘iyona va Baqtriyani.'],['Massagetlar malikasi kim edi?','To‘maris.'],['Gerodot Kir II va To‘maris jangi haqida qanday xulosa yozgan?','Bu jang barcha janglardan ham dahshatliroq bo‘lgani va Kir II halok bo‘lganini yozgan.'],['Frada qaysi hududdagi qo‘zg‘olonga rahbarlik qilgan?','Marg‘iyonadagi qo‘zg‘olonga.'],['Frada qo‘zg‘oloni qachon bostirilgan?','Miloddan avvalgi 522-yilda.'],['Doro I Marg‘iyona isyonini bostirish uchun kimga chopar yuborgan?','Baqtriya satrapi Dadarshishga.'],['Shiroq kim bo‘lgan?','Sak qabilasidan bo‘lgan cho‘pon.'],['Shiroq forslarni qayerga boshlab borgan?','Suvsiz sahroga.'],['Shiroq forslarni necha kun adashtirib yurgan?','Yetti kun.'],['Shiroq o‘z xalqini nimadan qutqarganini aytgan?','Halokatdan qutqarganini aytgan.'],['Satrapiya nima?','Ahamoniylar davlatidagi alohida viloyat.'],['Satrap kim edi?','Satrapiya hokimi.'],['O‘rta Osiyoning forslar bosib olgan viloyatlari nechta satrapiyaga bo‘lingan?','Uchta satrapiyaga.'],['Satrapiyalar qanday majburiyatlarni bajargan?','Shohga yillik soliq-o‘lpon yetkazgan hamda saroy va ibodatxona qurilishiga safarbar etilgan.'],['Soliq sifatida nimalar berilgan?','Kumush, chorva mollar, hunarmandchilik buyumlari, kiyim-kechak, matolar va hayvon terilari.'],['Marafon jangida fors qo‘shinlari safi markazida kimlar muvaffaqiyatli urishgan?','Saklar.'],['Baqtriyaliklar qanday qurollar bilan jang qilgan?','Kamon va nayzalar bilan.'],['Saklar qanday qurollar bilan jang qilgan?','Xanjar va jangovar boltalar bilan.'],['Ahamoniylar davriga oid qadimiy manzilgohlarni ayting.','Ko‘ktepa, Daratepa, Xumbuztepa va Ko‘zaliqir.'],['Amudaryo xazinasi qachon va qayerdan topilgan?','1877-yilda Qubodiyon vohasidan, qadimgi Baqtriya yeridan.'],['Amudaryo xazinasi qayerda saqlanadi?','Buyuk Britaniya muzeyida.'],['Suzadagi saroy yozuviga ko‘ra, Sug‘diyonadan nima keltirilgan?','Olmos, la’l va yoqut.'],['Suzadagi saroy yozuviga ko‘ra, Xorazmdan nima keltirilgan?','Qo‘llangan to‘q ko‘k yoqut.'],['Suzadagi saroy yozuviga ko‘ra, Misrdan nima keltirilgan?','Kumush va jez.'],['Suzadagi saroy yozuviga ko‘ra, oltin qayerdan keltirilgan?','Sard va Baqtriyadan.'],['Shahar va qo‘rg‘onlar atrofidagi dalalarga suv nima orqali olib kelingan?','Anhorlar va ariqlar orqali.'],['Miloddan avvalgi V–IV asrlarda O‘rta Osiyoda nima keng tarqalgan?','Dastlabki tanga pullar.']];const T=C.map((x,i)=>[x[0],[x[1],C[(i+5)%C.length][1],C[(i+12)%C.length][1],C[(i+19)%C.length][1]],0,'To‘g‘ri javob: '+x[1]]);let si=0,sel=null,rem=0,ci=0,ti=0,scoreN=0;function mix(a){return a.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x)}function openP(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelector('[data-p="'+id+'"]').classList.add('on');stick.style.display='none'}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>openP(x.dataset.p));function initM(){si=0;mp.style.display='block';md.classList.remove('on');loadM()}function loadM(){let a=S[si];rem=a.length;sel=null;mb.textContent='Bosqich: '+(si+1)+' / '+S.length;mc.textContent='Qoldi: '+rem+' juftlik';mf.style.width=(si/S.length*100)+'%';ml.innerHTML='';mr.innerHTML='';a.forEach((x,i)=>ml.appendChild(make(x[0],i)));mix(a.map((x,i)=>({t:x[1],i}))).forEach(x=>mr.appendChild(make(x.t,x.i)))}function make(t,i){let b=document.createElement('button');b.className='match';b.textContent=t;b.dataset.i=i;b.onclick=()=>pick(b);return b}function pick(b){if(b.classList.contains('ok')||b===sel)return;if(!sel){sel=b;b.classList.add('sel');return}if(sel.dataset.i===b.dataset.i&&sel.parentElement!==b.parentElement){b.classList.add('ok');sel.classList.remove('sel');sel.classList.add('ok');sel=null;rem--;mc.textContent='Qoldi: '+rem+' juftlik';if(!rem)setTimeout(()=>{si++;if(si<S.length)loadM();else{mf.style.width='100%';mp.style.display='none';md.classList.add('on')}},350)}else{let a=sel;a.classList.add('bad');b.classList.add('bad');setTimeout(()=>{a.classList.remove('bad','sel');b.classList.remove('bad');sel=null},500)}}function loadC(){let x=C[ci];cc.textContent=(ci+1)+' / '+C.length;cf.style.width=(ci/C.length*100)+'%';cq.textContent=x[0];ca.textContent=x[1];ca.style.display='none';show.style.display='block';nextc.style.display='none'}show.onclick=()=>{ca.style.display='block';show.style.display='none';nextc.style.display='block'};nextc.onclick=()=>{ci++;if(ci<C.length)loadC();else{cp.style.display='none';cd.classList.add('on')}};function restartC(){ci=0;cp.style.display='block';cd.classList.remove('on');loadC()}function loadT(){let q=T[ti],rows=mix(q[1].map((t,i)=>({t,ok:i===0})));tc.textContent=(ti+1)+' / '+T.length;tf.style.width=(ti/T.length*100)+'%';tq.textContent=q[0];to.innerHTML='';rows.forEach((r,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=L[i]+'. '+r.t;b.onclick=()=>answer(b,r.ok,rows,q[3]);to.appendChild(b)});te.style.display='none';stick.style.display='none'}function answer(ch,ok,rows,ex){let bs=[...document.querySelectorAll('.opt')];bs.forEach((b,i)=>{b.disabled=true;if(rows[i].ok)b.classList.add('good')});if(ok)scoreN++;else ch.classList.add('bad');te.textContent='Izoh: '+ex;te.style.display='block';stick.style.display='flex'}function nextT(){ti++;if(ti<T.length)loadT();else{tp.style.display='none';stick.style.display='none';td.classList.add('on');score.textContent=scoreN+'/'+T.length;fb.textContent=scoreN>=24?'Juda yaxshi natija!':scoreN>=17?'Yaxshi natija.':'Savol-javob bo‘limini qayta takrorlang.'}}function restartT(){ti=0;scoreN=0;tp.style.display='block';td.classList.remove('on');loadT()}initM();loadC();loadT();</script></body></html>
