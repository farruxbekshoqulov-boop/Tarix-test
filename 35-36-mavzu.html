<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>35–36-§ | Yunon-makedon istilochilariga qarshi kurash</title><style>:root{--p:#3b82f6;--a:#8b5cf6;--g:#10b981;--r:#ef4444;--mut:#94a3b8;--line:#ffffff29}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#1e1b4b,#0f172a 60%,#020617);color:#fff;font-family:Arial,sans-serif;padding:10px 10px 92px}.app{max-width:540px;margin:auto;background:#1e293bf2;border:1px solid var(--line);border-radius:24px;padding:14px;box-shadow:0 20px 45px #0008}h1{font-size:20px;line-height:1.22;margin:0 0 12px}.nav{display:flex;gap:4px;background:#0f172ab3;padding:4px;border-radius:14px}.tab{flex:1;border:0;border-radius:10px;padding:10px 2px;background:transparent;color:var(--mut);font-size:13px;font-weight:800}.tab.on,.btn{background:linear-gradient(135deg,var(--p),var(--a));color:#fff}.page{display:none;flex-direction:column;gap:10px}.page.on{display:flex}.head{display:flex;justify-content:space-between;align-items:center}.badge{color:#93c5fd;background:#3b82f640;padding:5px 10px;border-radius:20px;font-weight:800;font-size:12px}.count{color:var(--mut);font-weight:800;font-size:13px}.bar{height:7px;border-radius:10px;overflow:hidden;background:#ffffff1f}.fill{height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#818cf8)}.hint{color:var(--mut);font-size:13px;line-height:1.4}.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ct{text-align:center;color:#93c5fd;font-size:13px;font-weight:bold}.list,.opts{display:grid;gap:8px}.match,.opt{border:2px solid var(--line);border-radius:12px;min-height:54px;padding:9px 7px;background:#0f172ae8;color:#fff;font-weight:700;font-size:13px;line-height:1.28}.match.sel{border-color:#38bdf8;background:#38bdf83d}.match.ok{border-color:var(--g);background:#10b98142;pointer-events:none}.match.bad,.opt.bad{border-color:var(--r);background:#ef44444d}.card{min-height:185px;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:17px;background:#0f172a92;border:2px dashed #ffffff38;border-radius:18px}.q{font-size:17px;line-height:1.42;font-weight:800}.ans{display:none;margin-top:13px;padding:11px;border-radius:12px;border:1px solid #34d39966;background:#064e3b99;color:#d1fae5;line-height:1.4;font-size:15px;font-weight:700}.btn{border:0;border-radius:14px;padding:14px;width:100%;font-size:16px;font-weight:800;margin-top:8px}.opt{text-align:left}.opt.good{border-color:var(--g);background:#10b98159;color:#bbf7d0}.exp{display:none;padding:10px 12px;border-left:4px solid var(--p);background:#3b82f633;color:#bfdbfe;font-size:13px;line-height:1.4}.done{display:none;text-align:center;padding:28px 5px}.done.on{display:block}.score{width:76px;height:76px;border:3px solid var(--p);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:#93c5fd;font-size:20px;font-weight:900}.sticky{display:none;position:fixed;bottom:0;left:0;right:0;padding:10px 16px 14px;background:#0f172af4}.sticky .btn{max-width:540px;display:block;margin:auto}@media(max-width:390px){.match{font-size:12px;padding:7px 4px}}</style></head><body><main class="app"><h1>35–36-§. O‘rta Osiyo aholisining yunon-makedon istilochilariga qarshi kurashi</h1><nav class="nav"><button class="tab on" data-p="m">🧩 Moslash</button><button class="tab" data-p="c">🧠 Savol-javob</button><button class="tab" data-p="t">📝 Test</button></nav><section class="page on" id="m"><div id="mp"><div class="head"><span class="badge" id="mb"></span><span class="count" id="mc"></span></div><div class="bar"><div class="fill" id="mf"></div></div><p class="hint">Chap va o‘ng ustundagi mos tushunchalarni tanlang. To‘g‘ri juftlik yashil bo‘lib qoladi.</p><div class="cols"><div><p class="ct">Atamalar</p><div class="list" id="ml"></div></div><div><p class="ct">Izohlar</p><div class="list" id="mr"></div></div></div></div><div class="done" id="md"><div class="score">✓</div><h2>Moslashtirish tugadi!</h2><button class="btn" onclick="openP('c')">Savol-javobga o‘tish</button></div></section><section class="page" id="c"><div id="cp"><div class="head"><span class="badge">35–36-§ trenajyor</span><span class="count" id="cc"></span></div><div class="bar"><div class="fill" id="cf"></div></div><div class="card"><div class="q" id="cq"></div><div class="ans" id="ca"></div></div><button class="btn" id="show">Javobni ko‘rish</button><button class="btn" id="nextc" style="display:none">Keyingi savol ➔</button></div><div class="done" id="cd"><div class="score">✓</div><h2>Barcha savollar tugadi!</h2><button class="btn" onclick="openP('t')">Testga o‘tish</button></div></section><section class="page" id="t"><div id="tp"><div class="head"><span class="badge">35–36-§ test sinovi</span><span class="count" id="tc"></span></div><div class="bar"><div class="fill" id="tf"></div></div><div class="q" id="tq"></div><div class="opts" id="to"></div><div class="exp" id="te"></div></div><div class="done" id="td"><div class="score" id="score"></div><h2>Sinov yakunlandi!</h2><p class="hint" id="fb"></p><button class="btn" onclick="restartT()">Testni qayta ishlash</button></div></section></main><div class="sticky" id="stick"><button class="btn" onclick="nextT()">Keyingi savol ➔</button></div><script>'use strict';const M=[[['Mil. avv. 336-yil','Filipp II vafotidan so‘ng Aleksandr Makedoniya podshosi bo‘lgan yil'],['Mil. avv. 334-yil','Aleksandr Sharqqa yurish boshlagan yil'],['Mil. avv. 330-yil','Aleksandr Doro III qo‘shinlarini tor-mor keltirgan yil'],['10 yil','Aleksandrning Sharqqa yurishi davom etgan muddat']],[['Akinak','Xanjar'],['Sagaris','Jangovar oybolta'],['Suvoriylar','Dushmanga qarshi hujumni boshlab bergan otliq jangchilar'],['Palaxmon','Qal’a va shaharlarni himoya qilishda ishlatilgan qurol']],[['Mil. avv. 329-yil','Yunon-makedonlar Maroqandani egallagan yil'],['Spitaman','Sug‘diyona xalqi bosqinchilarga qarshi kurashida boshchilik qilgan lashkarboshi'],['Politimet','Makedoniyaliklarga qarshi jang bo‘lgan Zarafshon daryosining manbalardagi nomi'],['Kurushkat (Kiropolis)','Aleksandr Maroqandadan keyin bosib olmoqchi bo‘lgan shahar']],[['Yaksart (Sirdaryo)','Aleksandr saklarga qarshi kurash uchun qal’a barpo ettirgan daryo'],['Aleksandriya Esxata','Yaksart bo‘yida barpo etilgan qal’aning nomi'],['Oksiart','Roksananing otasi; keyinchalik Baqtriya viloyatining hokimi etib tayinlangan'],['Roksana','Oksiartning qizi; Aleksandr unga uylangan']],[['Mil. avv. 328-yil kuzida','Spitaman Aleksandr bilan hal qiluvchi jangda yengilgan vaqt'],['Agema','Makedoniyaliklarning sara otliq gvardiyasi'],['Salavkiylar, Yunon-Baqtriya va Parfiya','Mahalliy va yunon madaniyati qo‘shilishi asosida taraqqiy etgan antik davlatlar'],['Suvli xandaq','Qal’aga boradigan yo‘lni to‘sib turgan mudofaa inshooti']]];const C=[['Filipp II vafotidan keyin Makedoniya podshosi kim bo‘lgan?','20 yoshga to‘lgan o‘g‘li Aleksandr.'],['Aleksandr Sharqqa yurishni qachon boshlagan?','Miloddan avvalgi 334-yilda; yurish 10 yil davom etgan.'],['Aleksandr miloddan avvalgi 330-yilda kimning qo‘shinlarini tor-mor keltirgan?','Ahamoniylar sulolasidan bo‘lgan oxirgi Fors shohi Doro III qo‘shinlarini.'],['O‘rta Osiyo jangchilari qanday qurollar bilan qurollangan?','Xanjar (akinak), qilich, jangovar oybolta (sagaris), nayza va kamon bilan.'],['Dushmanga qarshi hujumni kimlar boshlab bergan?','Suvoriylar.'],['Qal’a va shaharlarni himoya qilishda o‘q-yoydan tashqari nima ishlatilgan?','Palaxmon hamda tosh va pishiq loydan tayyorlangan yadrolar.'],['Shahar devorlari qanday bo‘lgan?','Burjlar va shinaklari bo‘lgan mustahkam devorlar; tepasida kamonchilar uchun yo‘laklar bo‘lgan.'],['Qal’aga boradigan yo‘lni nima to‘sib turgan?','Suv to‘ldirilgan chuqur va keng xandaq.'],['Yunon-makedonlar Maroqandani qachon egallagan?','Miloddan avvalgi 329-yilda.'],['Sug‘diyona xalqining kurashiga kim boshchilik qilgan?','Iste’dodli lashkarboshi Spitaman.'],['Spitaman qo‘shiniga kimlar qo‘shilgan?','Baqtriyaliklar va saklar.'],['Spitaman qaysi shaharni qamal qilgan?','Maroqandani.'],['Makedoniyaliklarga qarshi jang qaysi daryo bo‘yida bo‘lgan?','Manbalarda Politimet deb atalgan Zarafshon daryosi bo‘yida.'],['Spitaman qachon hal qiluvchi jangda yengilgan?','Miloddan avvalgi 328-yil kuzida.'],['Spitamanni kimlar o‘ldirgan?','Ko‘chmanchi qabilalar boshliqlari.'],['Aleksandr saklarga qarshi kurash uchun qayerda qal’a barpo ettirgan?','Yaksart (Sirdaryo) bo‘yidagi Xo‘jand yaqinida.'],['Bu qal’a qanday nomlangan?','Aleksandriya Esxata, ya’ni Chekka Aleksandriya.'],['Aleksandr kimga uylangan?','Oksiartning qizi Roksanaga.'],['Oksiart qanday lavozimga tayinlangan?','Baqtriya viloyatining hokimi etib.'],['Mahalliy zodagonlar oilalaridan yoshlar qaysi gvardiyaga qabul qilingan?','Makedoniyaliklarning sara otliq gvardiyasi — agemaga.'],['Bosqin oqibatida qanday madaniy jarayon yuz bergan?','Mahalliy va yunon madaniyati, an’analarining qo‘shilishi yuz bergan.'],['Shu asosda qaysi antik davlatlar taraqqiy etgan?','Salavkiylar, Yunon-Baqtriya va Parfiya.']];const T=C.map((x,i)=>({q:x[0],a:x[1],w:[C[(i+4)%C.length][1],C[(i+9)%C.length][1],C[(i+15)%C.length][1]]}));function sh(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function openP(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelector('[data-p="'+id+'"]').classList.add('on');stick.style.display='none'}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>openP(x.dataset.p));let mi=0,chosen=null,left=0;function startM(){mi=0;mp.style.display='block';md.classList.remove('on');loadM()}function b(t,i){let x=document.createElement('button');x.className='match';x.textContent=t;x.dataset.i=i;x.onclick=()=>pick(x);return x}function loadM(){let p=M[mi];chosen=null;left=p.length;mb.textContent='Bosqich: '+(mi+1)+' / '+M.length;mc.textContent='Qoldi: '+left+' juftlik';mf.style.width=(mi/M.length*100)+'%';ml.innerHTML='';mr.innerHTML='';p.forEach((x,i)=>ml.appendChild(b(x[0],i)));sh(p.map((x,i)=>[x[1],i])).forEach(x=>mr.appendChild(b(x[0],x[1])))}function pick(x){if(x.classList.contains('ok')||x===chosen)return;if(!chosen){chosen=x;x.classList.add('sel');return}if(chosen.dataset.i===x.dataset.i&&chosen.parentElement!==x.parentElement){chosen.classList.remove('sel');chosen.classList.add('ok');x.classList.add('ok');chosen=null;left--;mc.textContent='Qoldi: '+left+' juftlik';if(!left)setTimeout(()=>{mi++;if(mi<M.length)loadM();else{mf.style.width='100%';mp.style.display='none';md.classList.add('on')}},400)}else{let z=chosen;z.classList.add('bad');x.classList.add('bad');setTimeout(()=>{z.classList.remove('bad','sel');x.classList.remove('bad');chosen=null},450)}}let ci=0;function loadC(){cc.textContent=(ci+1)+' / '+C.length;cf.style.width=(ci/C.length*100)+'%';cq.textContent=C[ci][0];ca.textContent=C[ci][1];ca.style.display='none';show.style.display='block';nextc.style.display='none'}show.onclick=()=>{ca.style.display='block';show.style.display='none';nextc.style.display='block'};nextc.onclick=()=>{ci++;if(ci<C.length)loadC();else{cp.style.display='none';cd.classList.add('on')}};let ti=0,sc=0;function loadT(){let q=T[ti],opts=sh([{t:q.a,ok:1},...q.w.map(t=>({t,ok:0}))]);tc.textContent=(ti+1)+' / '+T.length;tf.style.width=(ti/T.length*100)+'%';tq.textContent=q.q;to.innerHTML='';te.style.display='none';opts.forEach((o,i)=>{let x=document.createElement('button');x.className='opt';x.textContent='ABCD'[i]+'. '+o.t;x.onclick=()=>ans(x,o.ok,opts,q.a);to.appendChild(x)});stick.style.display='none'}function ans(x,ok,opts,a){let all=[...document.querySelectorAll('.opt')];all.forEach((z,i)=>{z.disabled=true;if(opts[i].ok)z.classList.add('good')});if(ok)sc++;else x.classList.add('bad');te.textContent='Izoh: To‘g‘ri javob — '+a;te.style.display='block';stick.style.display='flex'}function nextT(){ti++;if(ti<T.length)loadT();else{tp.style.display='none';stick.style.display='none';td.classList.add('on');score.textContent=sc+'/'+T.length;fb.textContent=sc>=18?'Juda yaxshi!':sc>=12?'Yaxshi, mavzuni yana takrorlang.':'Savol-javob bo‘limini qayta ishlang.'}}function restartT(){ti=0;sc=0;tp.style.display='block';td.classList.remove('on');loadT()}startM();loadC();loadT();</script></body></html>
