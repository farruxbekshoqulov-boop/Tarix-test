<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>37-§ Salavkiylar va Yunon-Baqtriya</title><style>:root{--p:#3b82f6;--a:#8b5cf6;--g:#10b981;--r:#ef4444;--m:#94a3b8;--l:#ffffff29}*{box-sizing:border-box}body{margin:0;padding:10px 10px 92px;background:radial-gradient(circle at top right,#1e1b4b,#0f172a 60%,#020617);color:#fff;font-family:Arial,sans-serif}.app{max-width:540px;margin:auto;padding:14px;background:#1e293bf2;border:1px solid var(--l);border-radius:24px;box-shadow:0 20px 45px #0008}h1{font-size:20px;line-height:1.2;margin:0 0 12px}.nav{display:flex;gap:4px;padding:4px;border-radius:14px;background:#0f172ab3}.tab{flex:1;border:0;border-radius:10px;padding:10px 2px;background:transparent;color:var(--m);font-size:13px;font-weight:800}.tab.on,.btn{background:linear-gradient(135deg,var(--p),var(--a));color:white}.page{display:none;flex-direction:column;gap:10px}.page.on{display:flex}.head{display:flex;justify-content:space-between;align-items:center}.badge{padding:5px 10px;border-radius:18px;background:#3b82f640;color:#93c5fd;font-size:12px;font-weight:bold}.count{color:var(--m);font-size:13px;font-weight:bold}.bar{height:7px;background:#ffffff1f;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#818cf8)}.hint{font-size:13px;color:var(--m);line-height:1.4}.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ct{text-align:center;color:#93c5fd;font-size:13px;font-weight:bold}.list,.opts{display:grid;gap:8px}.match,.opt{min-height:55px;padding:9px 7px;border:2px solid var(--l);border-radius:12px;background:#0f172ae8;color:white;font-size:13px;font-weight:bold;line-height:1.28}.match.sel{border-color:#38bdf8;background:#38bdf840}.match.ok{border-color:var(--g);background:#10b98144;pointer-events:none}.match.bad,.opt.bad{border-color:var(--r);background:#ef44444d}.card{min-height:185px;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:16px;border:2px dashed #ffffff38;border-radius:18px;background:#0f172a8c}.q{font-size:17px;font-weight:bold;line-height:1.42}.ans{display:none;margin-top:13px;padding:11px;border:1px solid #34d39966;border-radius:12px;background:#064e3b99;color:#d1fae5;font-size:15px;font-weight:bold;line-height:1.4}.btn{width:100%;border:0;border-radius:14px;padding:14px;margin-top:8px;font-size:16px;font-weight:bold}.opt{text-align:left}.opt.good{border-color:var(--g);background:#10b98159;color:#bbf7d0}.exp{display:none;padding:10px 12px;border-left:4px solid var(--p);background:#3b82f633;color:#bfdbfe;font-size:13px;line-height:1.4}.done{display:none;padding:28px 5px;text-align:center}.done.on{display:block}.score{width:76px;height:76px;margin:0 auto 12px;border:3px solid var(--p);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#93c5fd;font-size:20px;font-weight:bold}.sticky{display:none;position:fixed;bottom:0;left:0;right:0;padding:10px 16px 14px;background:#0f172af4}.sticky .btn{display:block;max-width:540px;margin:auto}@media(max-width:390px){.match{font-size:12px;padding:7px 4px}}</style></head><body><main class="app"><h1>37-§. Salavkiylar davlati va Yunon-Baqtriya podsholigi</h1><nav class="nav"><button class="tab on" data-p="m">🧩 Moslash</button><button class="tab" data-p="c">🧠 Savol-javob</button><button class="tab" data-p="t">📝 Test</button></nav><section id="m" class="page on"><div id="mp"><div class="head"><span id="mb" class="badge"></span><span id="mc" class="count"></span></div><div class="bar"><div id="mf" class="fill"></div></div><p class="hint">Atama va izohni moslang. To‘g‘ri juftlik yashil rangda o‘rnida qoladi.</p><div class="cols"><div><p class="ct">Atamalar</p><div id="ml" class="list"></div></div><div><p class="ct">Izohlar</p><div id="mr" class="list"></div></div></div></div><div id="md" class="done"><div class="score">✓</div><h2>Moslashtirish tugadi!</h2><button class="btn" onclick="openP('c')">Savol-javobga o‘tish</button></div></section><section id="c" class="page"><div id="cp"><div class="head"><span class="badge">37-§ trenajyor</span><span id="cc" class="count"></span></div><div class="bar"><div id="cf" class="fill"></div></div><div class="card"><div id="cq" class="q"></div><div id="ca" class="ans"></div></div><button id="show" class="btn">Javobni ko‘rish</button><button id="nextc" class="btn" style="display:none">Keyingi savol ➔</button></div><div id="cd" class="done"><div class="score">✓</div><h2>Savollar tugadi!</h2><button class="btn" onclick="openP('t')">Testga o‘tish</button></div></section><section id="t" class="page"><div id="tp"><div class="head"><span class="badge">37-§ test sinovi</span><span id="tc" class="count"></span></div><div class="bar"><div id="tf" class="fill"></div></div><div id="tq" class="q"></div><div id="to" class="opts"></div><div id="te" class="exp"></div></div><div id="td" class="done"><div id="score" class="score"></div><h2>Sinov yakunlandi!</h2><p id="fb" class="hint"></p><button class="btn" onclick="restartT()">Testni qayta ishlash</button></div></section></main><div id="stick" class="sticky"><button class="btn" onclick="nextT()">Keyingi savol ➔</button></div><script>'use strict';const M=[[['Mil. avv. 323-yil 13-iyun','Makedoniyalik Aleksandr vafot etgan sana'],['Makedoniya, Misr va Suriya','Aleksandr vafotidan keyin davlati bo‘lingan uch qism'],['Mil. avv. 312-yil','Salavk Bobil hukmdori bo‘lgan yil'],['Salavkiylar davlati','Mesopotamiya, Eron, Parfiya, Baqtriya, Sug‘diyona va Marg‘iyonani qamrab olgan davlat']],[['Satraplar','O‘rta Osiyo viloyatlarini boshqargan shaxslar'],['Strateglar','Davlat mudofaasi va qo‘shinlarni tashkil etish bilan shug‘ullangan sobiq lashkarboshilar'],['Antiox','Parfiya, Marg‘iyona, Baqtriya va Sug‘diyonaga noib etib tayinlangan shaxs'],['Apama','Spitamanning qizi; Antioxning onasi']],[['Kampirtepa qal’asi','Termiz yaqinidagi Amudaryoning o‘ng qirg‘og‘ida joylashgan qal’a'],['Uzundara qal’asi','Boysun tog‘larida, Baqtriya va Sug‘diyonani bog‘lovchi yo‘lni qo‘riqlagan qal’a'],['Mil. avv. 250-yil','Baqtriya Salavkiylar davlatidan ajralib chiqqan yil'],['Diodot','O‘zini podsho deb e’lon qilgan Baqtriya shaharlari hukmdori']],[['Yevtidem','Diodotdan keyin Yunon-Baqtriyada hukmronlik qilgan shaxs'],['Demetriy','Hukmronligida Hindistonning bir qismi qo‘shib olingan hukmdor'],['Mitridat I','Parfiyada hokimiyat qo‘liga o‘tgach Baqtriyaga harbiy tazyiqni kuchaytirgan hukmdor'],['Yuechji qabilalari','Mil. avv. 140–130-yillarda Yunon-Baqtriyani bosib olgan ko‘chmanchilar']],[['120 yil','Yunon-Baqtriya davlati taraqqiy etgan muddat'],['Oyxonim','Baqtriyada joylashgan qadimgi yunon shahri'],['Tangalar','Yunon-Baqtriyada hukmdorlar tasviri tushirilgan buyumlar'],['Buyuk Ipak yo‘lining janubiy tarmog‘i','Baqtriya orqali Xitoydan Hindistonga o‘tgan yo‘l']]];const C=[['Aleksandr vafotidan keyin uning davlati qaysi uch qismga bo‘lingan?','Makedoniya, Misr va Suriyaga.'],['Salavk qachon Bobil hukmdori bo‘lgan?','Miloddan avvalgi 312-yilda.'],['Salavkiylar davlati tarkibiga qaysi O‘rta Osiyo hududlari kirgan?','Baqtriya, Sug‘diyona va Marg‘iyona.'],['O‘rta Osiyo viloyatlarini kimlar boshqargan?','Satraplar.'],['Strateglar nima bilan shug‘ullangan?','Davlat mudofaasi va qo‘shinlarni tashkil etish bilan.'],['Antiox qaysi viloyatlarga noib etib tayinlangan?','Parfiya, Marg‘iyona, Baqtriya va Sug‘diyonaga.'],['Apama kim bo‘lgan?','Spitamanning qizi va Antioxning onasi.'],['Apameya shahri kimning sharafiga nomlangan?','Malika Apamaning sharafiga.'],['Sug‘diycha “Spitamana” nomining ildizlari avesto tilida nimani anglatgan?','“Spenta-mana”, ya’ni “Muqaddas ruh” ma’nosini.'],['Antiox hukmronligida qaysi shaharlar yirik markazlarga aylangan?','Baqtra, Maroqanda, Marg‘iyona Antioxiyasi (Marv) va Termiz.'],['Kampirtepa qal’asi qayerda joylashgan?','Termiz yaqinida, Amudaryoning o‘ng qirg‘og‘ida.'],['Uzundara qal’asi qayerda joylashgan?','Boysun tog‘larida.'],['Yunon-Baqtriya podsholigi qachon Salavkiylardan ajralib chiqqan?','Miloddan avvalgi 250-yilda.'],['Yunon-Baqtriya davlatiga kim asos solgan?','Bir qancha Baqtriya shaharlari hukmdori Diodot.'],['Diodotdan keyin kim hukmronlik qilgan?','Yevtidem, undan keyin uning o‘g‘li Demetriy.'],['Demetriy davrida qanday hudud qo‘shib olingan?','Hindistonning bir qismi.'],['Mitridat I hokimiyatga kelgach, Yunon-Baqtriya nimaga majbur bo‘lgan?','Tinimsiz urushlar olib borishga.'],['Yunon-Baqtriyani kimlar bosib olgan?','Ko‘chmanchi yuechji qabilalari.'],['Yunon-Baqtriya davlati qancha taraqqiy etgan?','120 yil.'],['Yunon-Baqtriyada savdo rivojlanganini nima ko‘rsatadi?','Hukmdorlar tasviri tushirilgan tangalar zarb qilingani va savdo yo‘llari jonlangani.'],['Baqtriya orqali qaysi yo‘lning janubiy tarmog‘i o‘tgan?','Buyuk Ipak yo‘lining janubiy tarmog‘i.'],['Mahalliy va yunon madaniyati qo‘shilishi asosida qaysi davlatlar taraqqiy etgan?','Salavkiylar, Yunon-Baqtriya va Parfiya.']];const T=C.map((x,i)=>({q:x[0],a:x[1],w:[C[(i+3)%C.length][1],C[(i+8)%C.length][1],C[(i+14)%C.length][1]]}));function sh(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function openP(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelector('[data-p="'+id+'"]').classList.add('on');stick.style.display='none'}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>openP(x.dataset.p));let mi=0,sel=null,rem=0;function b(t,i){let x=document.createElement('button');x.className='match';x.textContent=t;x.dataset.i=i;x.onclick=()=>pick(x);return x}function startM(){mi=0;mp.style.display='block';md.classList.remove('on');loadM()}function loadM(){let p=M[mi];sel=null;rem=p.length;mb.textContent='Bosqich: '+(mi+1)+' / '+M.length;mc.textContent='Qoldi: '+rem+' juftlik';mf.style.width=(mi/M.length*100)+'%';ml.innerHTML='';mr.innerHTML='';p.forEach((x,i)=>ml.appendChild(b(x[0],i)));sh(p.map((x,i)=>[x[1],i])).forEach(x=>mr.appendChild(b(x[0],x[1])))}function pick(x){if(x.classList.contains('ok')||x===sel)return;if(!sel){sel=x;x.classList.add('sel');return}if(sel.dataset.i===x.dataset.i&&sel.parentElement!==x.parentElement){sel.classList.remove('sel');sel.classList.add('ok');x.classList.add('ok');sel=null;rem--;mc.textContent='Qoldi: '+rem+' juftlik';if(!rem)setTimeout(()=>{mi++;if(mi<M.length)loadM();else{mf.style.width='100%';mp.style.display='none';md.classList.add('on')}},350)}else{let z=sel;z.classList.add('bad');x.classList.add('bad');setTimeout(()=>{z.classList.remove('bad','sel');x.classList.remove('bad');sel=null},450)}}let ci=0;function loadC(){cc.textContent=(ci+1)+' / '+C.length;cf.style.width=(ci/C.length*100)+'%';cq.textContent=C[ci][0];ca.textContent=C[ci][1];ca.style.display='none';show.style.display='block';nextc.style.display='none'}show.onclick=()=>{ca.style.display='block';show.style.display='none';nextc.style.display='block'};nextc.onclick=()=>{ci++;if(ci<C.length)loadC();else{cp.style.display='none';cd.classList.add('on')}};let ti=0,sc=0;function loadT(){let q=T[ti],o=sh([{t:q.a,ok:1},...q.w.map(t=>({t,ok:0}))]);tc.textContent=(ti+1)+' / '+T.length;tf.style.width=(ti/T.length*100)+'%';tq.textContent=q.q;to.innerHTML='';te.style.display='none';o.forEach((v,i)=>{let x=document.createElement('button');x.className='opt';x.textContent='ABCD'[i]+'. '+v.t;x.onclick=()=>ans(x,v.ok,o,q.a);to.appendChild(x)});stick.style.display='none'}function ans(x,ok,o,a){let all=[...document.querySelectorAll('.opt')];all.forEach((z,i)=>{z.disabled=true;if(o[i].ok)z.classList.add('good')});if(ok)sc++;else x.classList.add('bad');te.textContent='Izoh: To‘g‘ri javob — '+a;te.style.display='block';stick.style.display='flex'}function nextT(){ti++;if(ti<T.length)loadT();else{tp.style.display='none';stick.style.display='none';td.classList.add('on');score.textContent=sc+'/'+T.length;fb.textContent=sc>=18?'Juda yaxshi natija!':sc>=12?'Yaxshi natija, mavzuni takrorlang.':'Savol-javob bo‘limini qayta ishlang.'}}function restartT(){ti=0;sc=0;tp.style.display='block';td.classList.remove('on');loadT()}startM();loadC();loadT();</script></body></html>
