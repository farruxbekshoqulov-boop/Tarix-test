ff38;border-radius:18px;background:#0f172a8c}.q{font-size:17px;font-weight:bold;line-height:1.42}.ans{display:none;margin-top:13px;padding:11px;border:1px solid #34d39966;border-radius:12px;background:#064e3b99;color:#d1fae5;font-size:15px;font-weight:bold;line-height:1.4}.btn{width:100%;border:0;border-radius:14px;padding:14px;margin-top:8px;font-size:16px;font-weight:bold}.opt{text-align:left}.opt.good{border-color:var(--g);background:#10b98159;color:#bbf7d0}.exp{display:none;padding:10px 12px;border-left:4px solid var(--p);background:#3b82f633;color:#bfdbfe;font-size:13px;line-height:1.4}.done{display:none;padding:28px 5px;text-align:center}.done.on{display:block}.score{width:76px;height:76px;margin:0 auto 12px;border:3px solid var(--p);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#93c5fd;font-size:20px;font-weight:bold}.sticky{display:none;position:fixed;bottom:0;left:0;right:0;padding:10px 16px 14px;background:#0f172af4}.sticky .btn{display:block;max-width:540px;margin:auto}</style><body><main class="app"><h1>40-§. Qadimgi Qang‘ va Davan davlatlari</h1><nav class="nav"><button class="tab on" data-p="m">🧩 Moslash</button><button class="tab" data-p="c">🧠 Savol-javob</button><button class="tab" data-p="t">📝 Test</button></nav><section id="m" class="page on"><div id="mp"><div class="head"><span id="mb" class="badge"></span><span id="mc" class="count"></span></div><div class="bar"><div id="mf" class="fill"></div></div><p class="hint">Atama va izohni moslang. To‘g‘ri juftlik yashil rangda joyida qoladi.</p><div class="cols"><div><p class="ct">Atamalar</p><div id="ml" class="list"></div></div><div><p class="ct">Izohlar</p><div id="mr" class="list"></div></div></div></div><div id="md" class="done"><div class="score">✓</div><h2>Moslashtirish tugadi!</h2><button class="btn" onclick="openP('c')">Savol-javobga o‘tish</button></div></section><section id="c" class="page"><div id="cp"><div class="head"><span class="badge">40-§ trenajyor</span><span id="cc" class="count"></span></div><div class="bar"><div id="cf" class="fill"></div></div><div class="card"><div id="cq" class="q"></div><div id="ca" class="ans"></div></div><button id="show" class="btn">Javobni ko‘rish</button><button id="nextc" class="btn" style="display:none">Keyingi savol ➔</button></div><div id="cd" class="done"><div class="score">✓</div><h2>25 ta savol tugadi!</h2><button class="btn" onclick="openP('t')">Testga o‘tish</button></div></section><section id="t" class="page"><div id="tp"><div class="head"><span class="badge">40-§ test sinovi</span><span id="tc" class="count"></span></div><div class="bar"><div id="tf" class="fill"></div></div><div id="tq" class="q"></div><div id="to" class="opts"></div><div id="te" class="exp"></div></div><div id="td" class="done"><div id="score" class="score"></div><h2>Sinov yakunlandi!</h2><p id="fb" class="hint"></p><button class="btn" onclick="restartT()">Testni qayta ishlash</button></div></section></main><div id="stick" class="sticky"><button class="btn" onclick="nextT()">Keyingi savol ➔</button></div><script>'use strict';const M=[[['Qang‘yuy','Xitoy manbalarida Qang‘ davlati nomi'],['Saklar','Qang‘ davlatiga asos solgan xalq'],['Qanqa','Toshkent vohasidagi shahar-qal’a'],['Bityan','Xitoy manbalarida Qang‘diz nomi']],[['Shoshtepa','Doira shaklidagi olov ibodatxonasi qurilgan joy'],['Shimoliy tarmoq','Qang‘ hududidan o‘tgan Buyuk Ipak yo‘li tarmog‘i'],['Davan','Farg‘ona vodiysidagi davlat'],['Chjan Szyan','Davan haqida yozib qoldirgan Xitoy elchisi']],[['Ershi','Davan poytaxti'],['Tyanshan','“Samoviy tog‘lar” deb tarjima qilinadigan tog‘lar'],['Che Lin','Davan hukmdoriga yuborilgan elchi'],['“Qanotli otlar”','“Samoviy otlar”ning yana bir nomi']],[['60 ming nafar','Ikkinchi yurishdagi Xitoy qo‘shini soni'],['50 nafar','Davan sari yo‘lga chiqqan sarkardalar soni'],['Qirqinchi kun','Ershi tashqi devori buzilgan qamal kuni'],['To‘rt yil','“Samoviy otlar” uchun urush davomiyligi']]];const C=[['Qang‘ davlatiga qachon asos solingan?','Miloddan avvalgi III asrda.'],['Qang‘ qachon qudratli davlat birlashmasiga aylangan?','Miloddan avvalgi II asr oxirida.'],['Qang‘ qachon mayda mulklarga parchalanib ketgan?','Milodiy III asrda.'],['Davan qachon paydo bo‘lgan?','Taxminan miloddan avvalgi III asrda.'],['Davan qachon yuksak taraqqiy etgan?','Miloddan avvalgi II–I asrlarda.'],['Davan davlati qachon barham topgan?','Milodiy III asrda.'],['Qanqa shahar-qal’asi qayerda joylashgan?','Toshkent vohasining Oqqo‘rg‘on tumanida.'],['Qang‘ hududlari qayerda joylashgan?','O‘rta Sirdaryo sohillari bo‘ylab.'],['Davan qayerda joylashgan?','Farg‘ona vodiysida.'],['Shoshtepa qayerda joylashgan?','Toshkentda.'],['Qang‘ning madaniy markazlaridan biri qayer edi?','Toshkent vohasi.'],['Davan poytaxti qayer bo‘lgan?','Ershi shahri.'],['Qang‘ davlatiga kimlar asos solgan?','Saklar.'],['Qang‘da kimlar o‘z tangalarini zarb qildirgan?','Qang‘ hukmdorlari.'],['Davan haqida ma’lumot yozib qoldirgan kim?','Chjan Szyan.'],['Davan hukmdoriga elchi qilib kim yuborilgan?','Che Lin.'],['Qang‘liklar nimalarga sig‘ingan?','Olov va quyoshga.'],['Qang‘ aholisi qaysi ekinlarni ekkan?','Bug‘doy, arpa va sholi.'],['Qang‘ tog‘laridan shaharlarga qaysi metallar yetkazilgan?','Temir, mis, qalay va kumush.'],['Qang‘da qaysi hunarmandchiliklar rivojlangan?','Kulolchilik, qurolsozlik, to‘qimachilik va zargarlik.'],['Qang‘ hududidan qaysi tarmoq o‘tgan?','Buyuk Ipak yo‘lining shimoliy tarmog‘i.'],['Davan shaharlarining soni nechta deb ko‘rsatilgan?','70 ta katta-kichik shahar.'],['“Samoviy otlar” qanday otlar bo‘lgan?','Baquvvat va chopqir zotdor otlar.'],['Tyanshan nimani anglatadi?','“Samoviy tog‘lar”.'],['Che Lin Davanga nima bilan borgan?','Sovg‘a-salomlar va oltindan yasalgan ot haykali bilan.']];const T=[['Qang‘ davlatiga qachon asos solingan?',['Mil. avv. III asrda','Mil. avv. II asr oxirida','Mil. avv. II asrda','Milodiy III asrda'],0],['Qang‘ qachon qudratli davlat birlashmasiga aylangan?',['Mil. avv. III asrda','Mil. avv. II asr oxirida','Mil. avv. II–I asrlarda','Milodiy III asrda'],1],['Davan qachon yuksak taraqqiy etgan?',['Mil. avv. III asrda','Mil. avv. II asr oxirida','Mil. avv. II–I asrlarda','Milodiy III asrda'],2],['Qanqa shahar-qal’asi qayerda joylashgan?',['O‘rta Sirdaryo sohillari bo‘ylab','Toshkent vohasining Oqqo‘rg‘on tumanida','Farg‘ona vodiysida','Toshkentda'],1],['Davan qayerda joylashgan?',['Toshkent vohasida','O‘rta Sirdaryo sohillarida','Farg‘ona vodiysida','Shoshtepada'],2],['Qang‘ning madaniy markazlaridan biri qayer edi?',['Toshkent vohasi','Farg‘ona vodiysi','Ershi shahri','Tyanshan'],0],['Davan poytaxti qayer bo‘lgan?',['Qanqa','Bityan','Ershi','Shoshtepa'],2],['Qang‘ davlatiga kimlar asos solgan?',['Saklar','Qang‘ hukmdorlari','Davanliklar','Xitoyliklar'],0],['Davan haqida yozib qoldirgan Xitoy elchisi kim?',['Che Lin','Chjan Szyan','Qang‘yuy','Bityan'],1],['Davan hukmdoriga yuborilgan elchi kim?',['Chjan Szyan','Che Lin','Qang‘ hukmdori','Davan hukmdori'],1],['Qang‘liklar nimalarga sig‘ingan?',['Olov va quyoshga','Quyosh va samoga','Olov va suvga','Yer va olovga'],0],['Qang‘ aholisi qaysi ekinlarni ekkan?',['Bug‘doy, arpa, sholi','G‘alla, sholi, uzum','Bug‘doy, beda, uzum','Arpa, uzum, anor'],0],['Tog‘lardan Qang‘ shaharlariga nimalar yetkazilgan?',['Temir, mis, qalay, kumush','Temir, mis, beda, uzum','Charm, jun, kumush, qalay','Mis, arpa, sholi, kumush'],0],['Qang‘da qaysi hunarmandchiliklar rivojlangan?',['Kulolchilik, qurolsozlik, to‘qimachilik, zargarlik','Kulolchilik, yilqichilik, zargarlik, to‘qimachilik','Qurolsozlik, dehqonchilik, zargarlik, kulolchilik','To‘qimachilik, chorvachilik, zargarlik, qurolsozlik'],0],['Qang‘ hududidan qaysi tarmoq o‘tgan?',['Buyuk Ipak yo‘lining shimoliy tarmog‘i','Buyuk Ipak yo‘lining janubiy tarmog‘i','Buyuk Ipak yo‘lining g‘arbiy tarmog‘i','Buyuk Ipak yo‘lining sharqiy tarmog‘i'],0],['Davan shaharlarining soni nechta deb ko‘rsatilgan?',['50 ta','60 ta','70 ta','80 ta'],2],['“Samoviy otlar” qanday otlar bo‘lga th;mb.textContent='Bosqich: '+(mi+1)+' / '+M.length;mc.textContent='Qoldi: '+rem+' juftlik';mf.style.width=(mi/M.length*100)+'%';ml.innerHTML='';mr.innerHTML='';p.forEach((x,i)=>ml.appendChild(b(x[0],i)));sh(p.map((x,i)=>[x[1],i])).forEach(x=>mr.appendChild(b(x[0],x[1])))}function pick(x){if(x.classList.contains('ok')||x===sel)return;if(!sel){sel=x;x.classList.add('sel');return}if(sel.dataset.i===x.dataset.i&&sel.parentElement!==x.parentElement){sel.classList.remove('sel');sel.classList.add('ok');x.classList.add('ok');sel=null;rem--;mc.textContent='Qoldi: '+rem+' juftlik';if(!rem)setTimeout(()=>{mi++;if(mi<M.length)loadM();else{mf.style.width='100%';mp.style.display='none';md.classList.add('on')}},350)}else{let z=sel;z.classList.add('bad');x.classList.add('bad');setTimeout(()=>{z.classList.remove('bad','sel');x.classList.remove('bad');sel=null},450)}}let ci=0;function loadC(){cc.textContent=(ci+1)+' / '+C.length;cf.style.width=(ci/C.length*100)+'%';cq.textContent=C[ci][0];ca.textContent=C[ci][1];ca.style.display='none';show.style.display='block';nextc.style.display='none'}show.onclick=()=>{ca.style.display='block';show.style.display='none';nextc.style.display='block'};nextc.onclick=()=>{ci++;if(ci<C.length)loadC();else{cp.style.display='none';cd.classList.add('on')}};let ti=0,sc=0;function loadT(){let q=T[ti],o=sh(q[1].map((t,i)=>({t,ok:i===q[2]})));tc.textContent=(ti+1)+' / '+T.length;tf.style.width=(ti/T.length*100)+'%';tq.textContent=q[0];to.innerHTML='';te.style.display='none';o.forEach((v,i)=>{let x=document.createElement('button');x.className='opt';x.textContent='ABCD'[i]+'. '+v.t;x.onclick=()=>ans(x,v.ok,o,q[1][q[2]]);to.appendChild(x)});stick.style.display='none'}function ans(x,ok,o,a){let all=[...document.querySelectorAll('.opt')];all.forEach((z,i)=>{z.disabled=true;if(o[i].ok)z.classList.add('good')});if(ok)sc++;else x.classList.add('bad');te.textContent='Izoh: To‘g‘ri javob — '+a;te.style.display='block';stick.style.display='flex'}function nextT(){ti++;if(ti<T.length)loadT();else{tp.style.display='none';stick.style.display='none';td.classList.add('on');score.textContent=sc+'/'+T.length;fb.textContent=sc>=21?'Juda yaxshi natija!':sc>=15?'Yaxshi natija, mavzuni takrorlang.':'Savol-javob bo‘limini qayta ishlang.'}}function restartT(){ti=0;sc=0;tp.style.display='block';td.classList.remove('on');loadT()}startM();loadC();loadT();</script></body></html>
