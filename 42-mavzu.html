n><button class="tab" data-p="t">📝 Test</button></nav><section id="m" class="pg on"><div id="mp"><div class="head"><span id="mb"></span><span id="mc"></span></div><div class="bar"><div id="mf" class="fill"></div></div><p>To‘g‘ri juftlik tasdiqlanib, so‘ng ro‘yxatdan o‘chadi.</p><div class="cols"><div id="ml"></div><div id="mr"></div></div></div><div id="md" class="done"><h2>✓ Moslashtirish tugadi</h2><button class="btn" onclick="go('c')">Savol-javobga o‘tish</button></div></section><section id="c" class="pg"><div id="cp"><div class="head"><span>42-§ trenajyor</span><span id="cc"></span></div><div class="bar"><div id="cf" class="fill"></div></div><div class="card"><div id="cq" class="q"></div><div id="ca" class="ans"></div></div><button id="show" class="btn">👁 Javobni ko‘rish</button><button id="nextc" class="btn" style="display:none">Keyingi savol →</button></div><div id="cd" class="done"><h2>✓ Savollar tugadi</h2><button class="btn" onclick="go('t')">Testga o‘tish</button></div></section><section id="t" class="pg"><div id="tp"><div class="head"><span>42-§ test sinovi</span><span id="tc"></span></div><div class="bar"><div id="tf" class="fill"></div></div><div id="tq" class="q"></div><div id="to"></div><div id="te" class="exp"></div></div><div id="td" class="done"><h2 id="score"></h2><p id="fb"></p><button class="btn" onclick="restart()">Qayta ishlash</button></div></section></main><div id="stick" class="sticky"><button class="btn" onclick="nextT()">Keyingi savol →</button></div><script>const M=[[['Mil. avv. II asr','Buyuk ipak yo‘li vujudga kelgan davr'],['1877-yil','“Ipak yo‘li” atamasi berilgan yil'],['F. Rixtgofen','Atamani muomalaga kiritgan nemis geografi'],['12 ming km','Buyuk ipak yo‘li uzunligi']],[['Sariq dengiz','Yo‘l boshlanadigan qirg‘oq'],['O‘rta Yer dengizi','Yo‘l borib taqalgan sohillar'],['Sug‘diyona','Junli matolar, gilamlar va zeb-ziynat olib borilgan o‘lka'],['Badaxshon','Lojuvard olib borilgan o‘lka']],[['Baqtriya','Tuyalar olib borilgan o‘lka'],['Farg‘ona','Zotli otlar olib borilgan vodiy'],['Hindiston','Paxta matolari va chigit keltirilgan o‘lka'],['Xitoy','Guruch keltirilgan mamlakat']],[['Chjan Szyan','U-Di yuborgan elchi'],['Issiqko‘l','Elchi Tyanshan dovonlaridan o‘tib chiqqan ko‘l'],['Norin','Elchi Farg‘onaga kelgan daryo'],['Oloy','Elchi qaytishda o‘tgan vodiy']]];const C=[['Buyuk ipak yo‘li qachon vujudga kelgan?','Miloddan avvalgi II asrda.'],['“Ipak yo‘li” atamasini kim va qachon bergan?','F. Rixtgofen 1877-yilda.'],['Yo‘l uzunligi qancha?','12 ming kilometr.'],['Sug‘diyonadan nima olib borilgan?','Junli matolar, gilamlar, zeb-ziynat buyumlari va qimmatbaho toshlar.'],['Baqtriyadan nima olib borilgan?','Tuyalar.'],['Farg‘onadan nima olib borilgan?','Zotli otlar.'],['Badaxshondan nima olib borilgan?','Lojuvard.'],['Hindistondan nima keltirilgan?','Paxtadan tayyorlangan matolar va chigit.'],['Xitoydan nima keltirilgan?','Guruch.'],['O‘rta Osiyodan Xitoyga nimalar yetkazilgan?','Uzum, yong‘oq, anor va boshqa dehqonchilik mahsulotlari.'],['U-Di kimni elchi qilib yuborgan?','Chjan Szyanni.'],['Chjan Szyan qancha asirlikda yotgan?','O‘n yilcha.'],['Elchi qaysi ko‘lga chiqqan?','Issiqko‘lga.'],['Elchi qaysi daryo bo‘ylab Farg‘onaga kelgan?','Norin daryosi bo‘ylab.'],['Elchi Xitoyga nima olib ketgan?','Farg‘ona oti va beda urug‘ini.'],['Elchi qaysi vodiydan qaytgan?','Oloy vodiysidan.'],['Yo‘l chorrahasida qaysi mintaqa joylashgan?','O‘rta Osiyo.'],['O‘rta Osiyoga kimlar kelib turgan?','Savdogarlar, hunarmandlar, olimlar va san’atkorlar.'],['Yo‘l nimaga xizmat qilgan?','Savdo va madaniy aloqalarni rivojlantirishga.'],['Yo‘l tarixi nimaning asosini tashkil etgan?','Tinchlik va taraqqiyotning.']];const T=C.map((x,i)=>({q:x[0],a:x[1],w:[C[(i+4)%C.length][1],C[(i+9)%C.length][1],C[(i+14)%C.length][1]]}));function sh(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function go(x){document.querySelectorAll('.pg').forEach(e=>e.classList.remove('on'));document.querySelectorAll('.tab').forEach(e=>e.classList.remove('on'));document.getElementById(x).classList.add('on');document.querySelector('[data-p="'+x+'"]').classList.add('on');stick.style.display='none'}document.querySelectorAll('.tab').forEach(e=>e.onclick=()=>go(e.dataset.p));let st=0,se,rm;function add(p,t,i){let b=document.createElement('button');b.className='match';b.textContent=t;b.dataset.i=i;b.onclick=()=>pick(b);p.append(b)}function loadM(){let a=M[st];se=null;rm=4;mb.textContent='Bosqich: '+(st+1)+' / 4';mc.textContent='Qoldi: 4 juftlik';mf.style.width=st/4*100+'%';ml.innerHTML=mr.innerHTML='';a.forEach((x,i)=>add(ml,x[0],i));sh(a.map((x,i)=>[x[1],i])).forEach(x=>add(mr,x[0],x[1]))}function pick(b){if(b===se)return;if(!se){se=b;b.classList.add('sel');return}if(b.dataset.i==se.dataset.i&&b.parentElement!=se.parentElement){let a=se;a.classList.remove('sel');a.classList.add('ok');b.classList.add('ok');se=null;rm--;mc.textContent='Qoldi: '+rm+' juftlik';setTimeout(()=>{a.remove();b.remove();if(!rm){st++;if(st<4)loadM();else{mp.style.display='none';md.style.display='block'}}},350)}else{let a=se;a.classList.add('bad');b.classList.add('bad');setTimeout(()=>{a.className='match';b.classList.remove('bad');se=null},350)}}let ci=0;function card(){cc.textContent=ci+1+' / '+C.length;cf.style.width=ci/C.length*100+'%';cq.textContent=C[ci][0];ca.textContent=C[ci][1];ca.style.display='none';show.style.display='block';nextc.style.display='none'}show.onclick=()=>{ca.style.display='block';show.style.display='none';nextc.style.display='block'};nextc.onclick=()=>{ci++;if(ci<C.length)card();else{cp.style.display='none';cd.style.display='block'}};let ti=0,sc=0;function test(){let q=T[ti],o=sh([{t:q.a,k:1},...q.w.map(t=>({t,k:0}))]);tc.textContent=ti+1+' / '+T.length;tf.style.width=ti/T.length*100+'%';tq.textContent=q.q;to.innerHTML='';te.style.display='none';o.forEach((v,i)=>{let b=document.createElement('button');b.className='opt';b.textContent='ABCD'[i]+'. '+v.t;b.onclick=()=>ans(b,v.k,o,q.a);to.append(b)});stick.style.display='none'}function ans(b,k,o,a){[...to.children].forEach((x,i)=>{x.disabled=1;if(o[i].k)x.classList.add('good')});if(k)sc++;else b.classList.add('bad');te.textContent='Izoh: To‘g‘ri javob — '+a;te.style.display='block';stick.style.display='block'}function nextT(){ti++;if(ti<T.length)test();else{tp.style.display='none';stick.style.display='none';td.style.display='block';score.textContent=sc+'/'+T.length;fb.textContent=sc>=17?'Mavzuni juda yaxshi o‘zlashtiribsiz!':sc>=11?'Yaxshi natija. Xatolar ustida yana ishlang.':'Mavzuni qayta o‘qing va testni yana ishlang.'}}function restart(){ti=sc=0;td.style.display='none';tp.style.display='block';test()}loadM();card();test();</script></body></html>
