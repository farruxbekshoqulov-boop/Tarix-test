let stage=0,picked=null,remaining=0,locked=false,epoch=0;
function initMatch(){epoch++;stage=0;E('match-play-box').style.display='block';E('match-finish-box').style.display='none';loadMatchStage()}
function loadMatchStage(){epoch++;picked=null;locked=false;const pool=matchStages[stage];remaining=pool.length;E('match-stage-badge').textContent=`Bosqich: ${stage+1} / ${matchStages.length}`;E('match-counter').textContent=`Qoldi: ${remaining} ta juftlik`;E('match-progress').style.width=(stage/matchStages.length*100)+'%';const cards=[];pool.forEach(([left,right],i)=>{cards.push({id:i,text:left});cards.push({id:i,text:right})});shuffle(cards);const box=E('match-container');box.replaceChildren();cards.forEach(c=>{const b=document.createElement('button');b.className='match-btn';b.textContent=c.text;b.dataset.id=c.id;b.onclick=()=>onMatchClick(b);box.appendChild(b)})}
function onMatchClick(b){if(locked||b.classList.contains('matched'))return;if(b===picked){b.classList.remove('selected');picked=null;return}if(!picked){picked=b;b.classList.add('selected');return}const first=picked;picked=null;locked=true;if(first.dataset.id===b.dataset.id){first.classList.remove('selected');first.classList.add('matched');b.classList.add('matched');remaining--;E('match-counter').textContent=`Qoldi: ${remaining} ta juftlik`;const token=epoch;setTimeout(()=>{if(token!==epoch)return;first.remove();b.remove();locked=false;if(!remaining){stage++;if(stage<matchStages.length)loadMatchStage();else{E('match-progress').style.width='100%';E('match-play-box').style.display='none';E('match-finish-box').style.display='flex'}}},360)}else{first.classList.add('wrong');b.classList.add('wrong');setTimeout(()=>{first.classList.remove('selected','wrong');b.classList.remove('wrong');locked=false},400)}}
let cardIndex=0;
function loadFlashcard(){const [q,a]=flashcards[cardIndex];E('fc-counter').textContent=`${cardIndex+1} / ${flashcards.length}`;E('fc-progress').style.width=((cardIndex+1)/flashcards.length*100)+'%';E('fc-question').textContent=q;E('fc-answer').textContent=a;E('fc-answer').style.display='none';E('fc-toggle-btn').style.display='block';E('fc-next-btn').style.display='none'}
function toggleAnswer(){E('fc-answer').style.display='block';E('fc-toggle-btn').style.display='none';E('fc-next-btn').style.display='block'}
function nextFlashcard(){cardIndex++;if(cardIndex<flashcards.length)loadFlashcard();else{E('fc-play-box').style.display='none';E('fc-finish-box').style.display='flex'}window.scrollTo(0,0)}
function restartCards(){cardIndex=0;E('fc-play-box').style.display='block';E('fc-finish-box').style.display='none';loadFlashcard()}
let testIndex=0,score=0,answered=false,currentOptions=[];
function loadTestQuestion(){answered=false;const [q,opts,key]=testQuestions[testIndex];currentOptions=shuffle(opts.map((text,i)=>({text,right:i===key})));E('q-counter').textContent=`${testIndex+1} / ${testQuestions.length}`;E('q-progress').style.width=(testIndex/testQuestions.length*100)+'%';E('q-title').textContent=`${testIndex+1}. ${q}`;const box=E('q-options');box.replaceChildren();currentOptions.forEach((o,i)=>{let b=document.createElement('button');b.className='opt-btn';b.textContent='ABCD'[i]+'. '+o.text;b.onclick=()=>selectOpt(i);box.appendChild(b)});E('q-explanation').style.display='none';E('sticky-bar').style.display='none'}
function selectOpt(i){if(answered)return;answered=true;const buttons=[...E('q-options').children];buttons.forEach((b,j)=>{b.disabled=true;if(currentOptions[j].right)b.classList.add('correct');else if(j===i)b.classList.add('incorrect')});if(currentOptions[i].right)score++;E('q-explanation').textContent='💡 Izoh: To‘g‘ri javob — '+currentOptions.find(x=>x.right).text+'.';E('q-explanation').style.display='block';E('q-progress').style.width=((testIndex+1)/testQuestions.length*100)+'%';E('sticky-bar').style.display='flex'}
function nextTestQuestion(){if(!answered)return;testIndex++;if(testIndex<testQuestions.length)loadTestQuestion();else showQuizResult();window.scrollTo(0,0)}
function showQuizResult(){E('quiz-body').style.display='none';E('sticky-bar').style.display='none';E('quiz-result').style.display='flex';E('q-score').textContent=score+'/'+testQuestions.length;E('q-feedback').textContent=score===32?'Barcha savollarga to‘g‘ri javob berdingiz!':score>=29?'A’lo natija! Xatolaringizni ham takrorlang.':score>=20?'Yaxshi natija. Xatolar ustida ishlang.':'Mavzuni qayta o‘qib chiqing.'}
function restartTest(){testIndex=0;score=0;E('quiz-body').style.display='block';E('quiz-result').style.display='none';loadTestQuestion()}
initMatch();loadFlashcard();loadTestQuestion();
</script></body></html>
