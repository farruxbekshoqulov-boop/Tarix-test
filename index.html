<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>6-Sinf Tarix Testlari</title>
    <!-- Telegram Web App rasmiy kutubxonasi -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            background-color: var(--bg);
            color: var(--text-main);
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px 16px 100px 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
        }

        header h1 {
            font-size: 20px;
            color: var(--primary);
            margin-bottom: 4px;
        }

        header p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            margin-bottom: 20px;
            flex: 1;
        }

        .question-number {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .question-text {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 15px;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:active {
            transform: scale(0.98);
        }

        .option-btn.correct {
            background: #dcfce7;
            border-color: var(--success);
            color: var(--success);
            font-weight: 600;
        }

        .option-btn.wrong {
            background: #fee2e2;
            border-color: var(--danger);
            color: var(--danger);
            font-weight: 600;
        }

        .option-btn:disabled {
            cursor: default;
        }

        /* Pastki doimiy ko'rinadigan boshqaruv paneli */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.05);
            z-index: 1000;
        }

        .score-badge {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .next-btn {
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: none;
        }

        .next-btn:hover {
            background: var(--primary-hover);
        }

        /* Natija oynasi */
        .result-box {
            text-align: center;
            padding: 30px 10px;
            display: none;
        }

        .result-box h2 {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .result-box p {
            font-size: 16px;
            margin-bottom: 24px;
            color: var(--text-muted);
        }

        .restart-btn {
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>6-SINF TARIX TESTI</h1>
            <p>I Bo‘lim: Eng qadimgi tuzumdan sivilizatsiya sari</p>
        </header>

        <!-- Savollar bloki -->
        <div class="card" id="quiz-card">
            <span class="question-number" id="q-counter">Savol 1 / 5</span>
            <div class="question-text" id="q-text">Savol yuklanmoqda...</div>
            <div class="options-list" id="options-container"></div>
        </div>

        <!-- Natijalar bloki -->
        <div class="card result-box" id="result-card">
            <h2>Natija</h2>
            <p id="result-text"></p>
            <button class="restart-btn" onclick="restartQuiz()">Qaytadan boshlash 🔄</button>
        </div>
    </div>

    <!-- Pastki harakatchan panel -->
    <div class="bottom-bar" id="bottom-bar">
        <div class="score-badge" id="score-display">Ball: 0</div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Keyingisi ➡️</button>
    </div>

    <script>
        // Telegram Web App moslashtirish
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand(); // Ekranni to'liq yoyish
        }

        const questions = [
            {
                question: "O‘zbekiston hududidan topilgan eng qadimgi odam qoldiqlari qaysi g‘ordan aniqlangan?",
                options: ["Teshiktosh g‘ori", "Zarautsoy", "Obirahmat", "Selung‘ur"],
                correct: 0
            },
            {
                question: "Odamlar tomonidan birinchi bo‘lib o‘zlashtirilgan va ishlatilgan metall qaysi?",
                options: ["Temir", "Mis", "Bronza", "Oltin"],
                correct: 1
            },
            {
                question: "O‘rta tosh davri fanda qanday nomlanadi?",
                options: ["Paleolit", "Neolit", "Mezolit", "Eneolit"],
                correct: 2
            },
            {
                question: "Ibtidoiy jamoa davrida olov hosil qilish qaysi davrda kashf etilgan?",
                options: ["Ilk paleolit", "O‘rta paleolit", "Neolit", "Bronza davri"],
                correct: 1
            },
            {
                question: "O‘zbekiston hududida ilk dehqonchilik madaniyati qaysi hududda shakllangan?",
                options: ["Zarafshon vohasida", "Farg‘ona vodiysida", "Janubiy O‘zbekistonda (Zamonbobo, Sopollitepa)", "Toshkent vohasida"],
                correct: 2
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            document.getElementById('next-btn').style.display = 'none';

            const q = questions[currentIdx];
            document.getElementById('q-counter').innerText = `Savol ${currentIdx + 1} / ${questions.length}`;
            document.getElementById('q-text').innerText = q.question;

            const opts = document.getElementById('options-container');
            opts.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => selectOption(idx, btn);
                opts.appendChild(btn);
            });
        }

        function selectOption(idx, btn) {
            if (answered) return;
            answered = true;

            const q = questions[currentIdx];
            const allButtons = document.querySelectorAll('.option-btn');

            allButtons.forEach(b => b.disabled = true);

            if (idx === q.correct) {
                btn.classList.add('correct');
                score++;
                document.getElementById('score-display').innerText = `Ball: ${score}`;
            } else {
                btn.classList.add('wrong');
                allButtons[q.correct].classList.add('correct');
            }

            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-card').style.display = 'none';
            document.getElementById('bottom-bar').style.display = 'none';
            document.getElementById('result-card').style.display = 'block';

            const percent = Math.round((score / questions.length) * 100);
            document.getElementById('result-text').innerHTML = `
                Siz <b>${questions.length}</b> ta savoldan <b>${score}</b> tasiga to‘g‘ri javob berdingiz.<br>
                Ko‘rsatkich: <b>${percent}%</b>
            `;
        }

        function restartQuiz() {
            currentIdx = 0;
            score = 0;
            document.getElementById('score-display').innerText = `Ball: 0`;
            document.getElementById('quiz-card').style.display = 'block';
            document.getElementById('bottom-bar').style.display = 'flex';
            document.getElementById('result-card').style.display = 'none';
            loadQuestion();
        }

        // Dastlabki yuklash
        loadQuestion();
    </script>
</body>
</html>
